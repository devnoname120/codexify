<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Codexify status</title>
<style>
:root {
  color-scheme: light dark;
  --bg: var(--color-background-primary, light-dark(#ffffff, #171717));
  --panel: var(--color-background-secondary, light-dark(#f5f6f7, #222222));
  --panel-strong: light-dark(#eceef0, #2b2b2b);
  --text: var(--color-text-primary, light-dark(#171717, #f4f4f4));
  --muted: var(--color-text-secondary, light-dark(#62666d, #a7a7a7));
  --border: var(--color-border-primary, light-dark(#d9dce1, #3a3a3a));
  --accent: light-dark(#111111, #f5f5f5);
  --accent-text: light-dark(#ffffff, #171717);
  --good: light-dark(#18794e, #58c991);
  --warn: light-dark(#8a5a00, #e8b44f);
  --bad: light-dark(#b42318, #ff7b72);
  --focus: light-dark(#4c8bf5, #70a5ff);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: transparent; color: var(--text); }
body {
  font-family: var(--font-sans, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
  font-size: 13px;
  line-height: 1.4;
}
button { font: inherit; }
#root {
  display: flex;
  width: 100%;
  justify-content: center;
}
.card {
  width: 100%;
  max-width: 500px;
  padding: 11px 12px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--bg);
  box-shadow: 0 1px 2px light-dark(rgba(0, 0, 0, .04), rgba(0, 0, 0, .20));
}
.status-list { display: grid; gap: 5px; }
.status-row {
  display: flex;
  min-width: 0;
  min-height: 30px;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.status-copy {
  display: flex;
  min-width: 0;
  align-items: baseline;
  flex: 1 1 auto;
  flex-wrap: wrap;
  gap: 5px;
}
.status-label { font-weight: 650; letter-spacing: -.01em; }
.status-version {
  font: 600 12px/1.2 var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
}
.status-state { font-size: 12px; font-weight: 650; }
.status-help {
  flex-basis: 100%;
  color: var(--muted);
  font-size: 10px;
}
.status-pass { color: var(--good); }
.status-warning { color: var(--warn); }
.status-failure { color: var(--bad); }
.status-skipped, .status-muted { color: var(--muted); }
.row-actions, .utility-actions, .doctor-actions {
  display: flex;
  flex: 0 0 auto;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 6px;
}
.button {
  display: inline-flex;
  min-height: 29px;
  align-items: center;
  justify-content: center;
  padding: 5px 8px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--panel);
  color: var(--text);
  cursor: pointer;
  font-size: 11px;
  font-weight: 650;
  line-height: 1.2;
  white-space: nowrap;
}
.button:hover:not(:disabled) { background: var(--panel-strong); }
.button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.button.primary { border-color: var(--accent); background: var(--accent); color: var(--accent-text); }
.button.primary:hover:not(:disabled) { background: var(--accent); opacity: .88; }
.button.warning { border-color: color-mix(in srgb, var(--warn) 55%, var(--border)); color: var(--warn); }
.button.failure { border-color: color-mix(in srgb, var(--bad) 55%, var(--border)); color: var(--bad); }
.button:disabled { cursor: wait; opacity: .55; }
.workspace {
  margin-bottom: 8px;
  padding-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.workspace-head { display: grid; gap: 2px; margin-bottom: 7px; }
.workspace-title { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: -.01em; }
.workspace-copy { margin: 0; color: var(--muted); font-size: 11px; }
.project-picker { display: grid; gap: 6px; }
.project-search {
  width: 100%;
  min-height: 32px;
  padding: 6px 8px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--panel);
  color: var(--text);
  font: inherit;
}
.project-search:focus { outline: 2px solid var(--focus); outline-offset: 1px; }
.project-results { display: grid; gap: 5px; max-height: 260px; overflow: auto; }
.project-choice, .project-row {
  display: grid;
  width: 100%;
  gap: 2px;
  padding: 7px 8px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--panel);
  color: var(--text);
  cursor: pointer;
  text-align: left;
}
.project-choice { border-style: dashed; }
.project-choice:hover:not(:disabled), .project-row:hover:not(:disabled) {
  background: var(--panel-strong);
}
.project-choice:focus-visible, .project-row:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 1px;
}
.project-choice:disabled, .project-row:disabled { cursor: wait; opacity: .55; }
.project-choice-title, .project-row-title { font-size: 11px; font-weight: 700; }
.project-choice-detail, .project-row-detail {
  color: var(--muted);
  font-size: 10px;
  overflow-wrap: anywhere;
}
.project-state, .project-count {
  min-height: 14px;
  color: var(--muted);
  font-size: 10px;
  overflow-wrap: anywhere;
}
.project-state.failure { color: var(--bad); }
.workspace-name { margin-bottom: 5px; font-size: 12px; font-weight: 700; }
.workspace-fields { display: grid; gap: 5px; }
.workspace-field { min-width: 0; }
.workspace-field-label {
  display: block;
  margin-bottom: 1px;
  color: var(--muted);
  font-size: 9px;
  font-weight: 700;
  letter-spacing: .04em;
  text-transform: uppercase;
}
.workspace-path {
  display: block;
  padding: 5px 6px;
  border: 1px solid var(--border);
  border-radius: 7px;
  background: var(--panel);
  font: 10px/1.4 var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
  overflow-wrap: anywhere;
}
.utility-actions {
  justify-content: flex-start;
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px solid var(--border);
}
.doctor-panel {
  margin-top: 8px;
  overflow: hidden;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--panel);
}
.doctor-panel.warning {
  border-color: color-mix(in srgb, var(--warn) 45%, var(--border));
  background: color-mix(in srgb, var(--warn) 6%, var(--bg));
}
.doctor-panel.failure {
  border-color: color-mix(in srgb, var(--bad) 45%, var(--border));
  background: color-mix(in srgb, var(--bad) 6%, var(--bg));
}
.doctor-summary {
  display: flex;
  min-height: 34px;
  align-items: center;
  gap: 8px;
  padding: 7px 8px;
}
.doctor-summary-text { flex: 1 1 auto; font-size: 12px; font-weight: 650; }
.doctor-details {
  display: grid;
  gap: 7px;
  max-height: 290px;
  overflow: auto;
  padding: 8px;
  border-top: 1px solid var(--border);
}
.doctor-check { min-width: 0; }
.check-heading {
  display: flex;
  min-width: 0;
  align-items: baseline;
  gap: 6px;
}
.check-status {
  flex: 0 0 auto;
  font: 700 10px/1.2 var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
}
.check-copy { min-width: 0; overflow-wrap: anywhere; }
.check-id {
  font: 600 11px/1.3 var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
}
.check-detail, .check-remediation {
  margin: 2px 0 0 48px;
  color: var(--muted);
  font-size: 11px;
  overflow-wrap: anywhere;
}
.feedback {
  margin-top: 8px;
  padding: 7px 8px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--panel);
  color: var(--muted);
  font-size: 11px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.feedback.warning { border-color: color-mix(in srgb, var(--warn) 45%, var(--border)); color: var(--warn); }
.feedback.failure { border-color: color-mix(in srgb, var(--bad) 45%, var(--border)); color: var(--bad); }
.debug {
  display: none;
  margin-top: 8px;
  padding-top: 7px;
  border-top: 1px solid var(--border);
  color: var(--muted);
  font: 10px/1.4 var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace);
  overflow-wrap: anywhere;
}
.debug.visible { display: block; }
.initialization-error {
  width: 100%;
  max-width: 500px;
  padding: 9px 10px;
  border: 1px solid color-mix(in srgb, var(--bad) 45%, var(--border));
  border-radius: 9px;
  background: color-mix(in srgb, var(--bad) 6%, var(--bg));
  color: var(--bad);
}
@media (max-width: 420px) {
  .card { padding: 10px; }
  .status-row { align-items: flex-start; flex-direction: column; gap: 5px; }
  .row-actions { justify-content: flex-start; }
  .doctor-summary { align-items: flex-start; flex-wrap: wrap; }
  .doctor-actions { justify-content: flex-start; }
  .check-detail, .check-remediation { margin-left: 0; }
}
</style>
</head>
<body>
<div id="root" aria-live="polite"></div>
<script>
(() => {
  "use strict";

  const DEBUG_META_KEY = "io.github.devnoname120/codexify/debug";
  const PROJECT_RESULT_LIMIT = 50;
  const root = document.getElementById("root");
  const pending = new Map();
  let nextId = 1;
  let resizeObserver;
  let initialized = false;
  let currentData = null;
  let currentMetadata = null;
  let updateState = null;
  let updateChecking = false;
  let upgradeRunning = false;
  let doctorState = {
    phase: "idle",
    report: null,
    error: null,
    expanded: false,
    showAll: false,
    manual: false
  };
  let actionState = { kind: null, message: null, tone: null, pending: false };
  let automaticDoctorStarted = false;
  let debugEntries = [];
  let projectSearchTimer = null;
  let projectQueryGeneration = 0;
  let projectSelecting = false;
  let projectCatalog = {
    phase: "idle",
    query: "",
    projects: [],
    total: 0,
    warnings: [],
    error: null
  };

  function post(message) {
    window.parent.postMessage(message, "*");
  }

  function request(method, params) {
    const id = nextId++;
    post({ jsonrpc: "2.0", id, method, params });
    return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
  }

  function notify(method, params) {
    post({ jsonrpc: "2.0", method, params });
  }

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = String(text);
    return node;
  }

  function actionButton(label, className, handler, disabled) {
    const button = el("button", `button${className ? ` ${className}` : ""}`, label);
    button.type = "button";
    button.disabled = Boolean(disabled);
    button.addEventListener("click", handler);
    return button;
  }

  function objectFrom(value, selector) {
    const queue = [value];
    const seen = new Set();
    const nestedKeys = [
      "_meta", "meta", "result", "call_tool_result", "callToolResult",
      "mcp_tool_result", "mcpToolResult", "toolOutput", "toolResponseMetadata",
      "invoked_resource", "invokedResource"
    ];
    while (queue.length) {
      const candidate = queue.shift();
      if (!candidate || typeof candidate !== "object" || seen.has(candidate)) continue;
      seen.add(candidate);
      const selected = selector(candidate);
      if (selected) return selected;
      for (const key of nestedKeys) {
        if (candidate[key] && typeof candidate[key] === "object") queue.push(candidate[key]);
      }
    }
    return null;
  }

  function setupPayload(value) {
    return objectFrom(value, candidate => {
      const payload = candidate.structuredContent || candidate.structured_content;
      if (payload && payload.update && payload.connectorSchema) return payload;
      if (candidate.update && candidate.connectorSchema) return candidate;
      return null;
    });
  }

  function structuredPayload(value, predicate) {
    return objectFrom(value, candidate => {
      const payload = candidate.structuredContent || candidate.structured_content;
      if (payload && typeof payload === "object" && predicate(payload)) return payload;
      return predicate(candidate) ? candidate : null;
    });
  }

  function projectListPayload(value) {
    return structuredPayload(value, candidate =>
      Array.isArray(candidate.projects) && Number.isFinite(candidate.total)
    );
  }

  function projectSelectionPayload(value) {
    return structuredPayload(value, candidate =>
      (candidate.mode === "project" || candidate.mode === "without_project")
      && typeof candidate.active_root === "string"
      && candidate.active_root.length > 0
    );
  }

  function toolFailureText(value) {
    return objectFrom(value, candidate => {
      if (candidate.isError !== true && candidate.is_error !== true) return null;
      if (!Array.isArray(candidate.content)) return "The tool call failed.";
      const text = candidate.content
        .map(item => item && typeof item.text === "string" ? item.text : "")
        .filter(Boolean)
        .join("\n");
      return text || "The tool call failed.";
    });
  }

  function projectStateFromSelection(selection) {
    const withoutProject = selection.mode === "without_project";
    return {
      status: withoutProject ? "without_project" : "selected",
      selectionAvailable: true,
      accessRoot: typeof selection.access_root === "string" ? selection.access_root : null,
      name: typeof selection.project_name === "string"
        ? selection.project_name
        : withoutProject ? "Chat without a project" : "Selected project",
      activePath: selection.active_root,
      sourcePath: typeof selection.source_project_root === "string"
        ? selection.source_project_root
        : null,
      managedWorktree: Boolean(selection.managed_worktree),
      bindingScope: typeof selection.binding_scope === "string"
        ? selection.binding_scope
        : null,
      detail: null
    };
  }

  function debugPayload(value) {
    return objectFrom(value, candidate => {
      const payload = candidate[DEBUG_META_KEY];
      return payload && typeof payload === "object" ? payload : null;
    });
  }

  function toolText(value) {
    return objectFrom(value, candidate => {
      if (!Array.isArray(candidate.content)) return null;
      const text = candidate.content
        .map(item => item && typeof item.text === "string" ? item.text : "")
        .filter(Boolean)
        .join("\n");
      return text || null;
    }) || "The tool returned no text output.";
  }

  function errorText(error) {
    const value = error && typeof error === "object"
      ? error.message || (error.data && error.data.message) || JSON.stringify(error)
      : String(error);
    return String(value || "Unknown error").replace(/\s+/g, " ").trim().slice(0, 512);
  }

  function accepted(result, label) {
    if (result && (result.isError === true || result.is_error === true)) {
      throw new Error(`${label} was rejected by the host.`);
    }
    return result;
  }

  async function callTool(name, args) {
    if (initialized) {
      try {
        return await request("tools/call", { name, arguments: args || {} });
      } catch (error) {
        if (!(window.openai && typeof window.openai.callTool === "function")) throw error;
      }
    }
    if (window.openai && typeof window.openai.callTool === "function") {
      return window.openai.callTool(name, args || {});
    }
    throw new Error("This host does not expose widget tool calls.");
  }

  async function sendFollowUpMessage(prompt) {
    if (initialized) {
      try {
        const result = await request("ui/message", {
          role: "user",
          content: [{ type: "text", text: prompt }]
        });
        return accepted(result, "Follow-up message");
      } catch (error) {
        if (!(window.openai && typeof window.openai.sendFollowUpMessage === "function")) {
          throw error;
        }
      }
    }
    if (window.openai && typeof window.openai.sendFollowUpMessage === "function") {
      const result = await window.openai.sendFollowUpMessage({
        prompt,
        scrollToBottom: true
      });
      return accepted(result, "Follow-up message");
    }
    throw new Error("This host does not expose follow-up messages.");
  }

  async function openLink(url) {
    if (window.openai && typeof window.openai.openExternal === "function") {
      try {
        const result = await window.openai.openExternal({ href: url, redirectUrl: false });
        return accepted(result, "Open link");
      } catch (error) {
        if (!initialized) throw error;
      }
    }
    if (initialized) {
      const result = await request("ui/open-link", { url });
      return accepted(result, "Open link");
    }
    throw new Error("This host does not expose link opening.");
  }

  function connectorSlug() {
    let current = window;

    for (let depth = 0; depth < 8; depth += 1) {
      try {
        const hostname = String(current.location.hostname || "").toLowerCase();
        const match = hostname.match(/^asdk_app_([a-z0-9_-]+)\.web-sandbox\.oaiusercontent\.com$/);
        if (match) return match[1];
      } catch {
        break;
      }

      let parent;
      try {
        parent = current.parent;
        if (!parent || parent === current) break;
        void parent.location.href;
      } catch {
        break;
      }
      current = parent;
    }

    return null;
  }

  function refreshSettingsHref() {
    const slug = connectorSlug();
    return slug
      ? `#settings/Plugins/plugin_asdk_app_${slug}:~:text=Information-,Refresh,-Connected`
      : "#settings/Plugins";
  }

  function addDebugEntry(entry) {
    if (!entry || debugEntries.includes(entry)) return;
    debugEntries.push(entry);
  }

  function captureTiming(name, result, startedAt) {
    if (!currentData || !currentData.debug) return;
    const metadata = debugPayload(result);
    if (metadata && Number.isFinite(metadata.durationMs)) {
      addDebugEntry(`${name}: server ${metadata.durationMs} ms`);
    }
    const roundTrip = Math.max(0, Math.round(performance.now() - startedAt));
    addDebugEntry(`${name}: widget round trip ${roundTrip} ms`);
  }

  function reportSize() {
    notify("ui/notifications/size-changed", {
      width: Math.ceil(document.documentElement.clientWidth || root.getBoundingClientRect().width),
      height: Math.ceil(document.documentElement.scrollHeight)
    });
  }

  function scheduleSizeReport() {
    if (typeof requestAnimationFrame === "function") {
      requestAnimationFrame(reportSize);
    } else {
      setTimeout(reportSize, 0);
    }
  }

  function ensureResizeObserver() {
    if (resizeObserver || !("ResizeObserver" in window)) return;
    resizeObserver = new ResizeObserver(reportSize);
    resizeObserver.observe(document.documentElement);
  }

  function applyHostContext(context) {
    if (!context || typeof context !== "object") return;
    if (context.theme) document.documentElement.dataset.theme = context.theme;
  }

  function plural(count, singular, pluralForm) {
    return `${count} ${count === 1 ? singular : pluralForm}`;
  }

  function updateView() {
    const update = updateState || (currentData && currentData.update) || {};
    const current = update.currentVersion || (currentData && currentData.serverVersion) || "unknown";
    if (updateChecking) {
      return { current, label: "checking…", tone: "status-muted", latest: null };
    }
    switch (update.status) {
      case "update_available":
        return {
          current,
          label: update.latestVersion ? `v${update.latestVersion} available` : "update available",
          tone: "status-warning",
          latest: update.latestVersion || null
        };
      case "up_to_date":
        return { current, label: "✓", tone: "status-pass", latest: null };
      case "ahead_of_latest":
        return { current, label: "ahead of latest release", tone: "status-pass", latest: null };
      case "check_failed":
        return { current, label: "update status unknown", tone: "status-warning", latest: null };
      default:
        return { current, label: "status unknown", tone: "status-warning", latest: null };
    }
  }

  function renderUpdateRow() {
    const view = updateView();
    const row = el("div", "status-row");
    const copy = el("div", "status-copy");
    copy.append(
      el("span", "status-label", "Codexify:"),
      el("span", "status-version", `v${view.current}`),
      el("span", `status-state ${view.tone}`, view.label)
    );

    const actions = el("div", "row-actions");
    if (view.latest) {
      actions.append(actionButton(
        `Upgrade to v${view.latest}`,
        "primary",
        () => { void startUpgrade(); },
        upgradeRunning
      ));
    }
    actions.append(actionButton(
      updateChecking ? "Checking…" : "Check for updates",
      "",
      () => { void runUpdateCheck(); },
      updateChecking || upgradeRunning
    ));
    row.append(copy, actions);
    return row;
  }

  function renderSchemaRow() {
    const schema = currentData.connectorSchema || {};
    const row = el("div", "status-row");
    const copy = el("div", "status-copy");
    copy.append(el("span", "status-label", "Connector schema:"));

    if (schema.status === "current") {
      copy.append(
        el("span", "status-version", `v${schema.observedVersion || schema.advertisedVersion || "unknown"}`),
        el("span", "status-state status-pass", "✓")
      );
    } else if (schema.status === "stale") {
      copy.append(
        el("span", "status-version", `v${schema.observedVersion || "unknown"}`),
        el("span", "status-state status-warning", "refresh required")
      );
    } else {
      copy.append(el("span", "status-state status-warning", "version unknown"));
    }

    if (schema.refreshRecommended) {
      copy.append(el(
        "span",
        "status-help",
        "Select Codexify if needed, scroll below the list of tools, then click Refresh."
      ));
    }

    const actions = el("div", "row-actions");
    if (schema.refreshRecommended) {
      actions.append(actionButton(
        actionState.pending && actionState.kind === "refresh" ? "Opening…" : "Refresh",
        "primary",
        () => { void openRefreshSettings(); },
        actionState.pending
      ));
    }
    row.append(copy, actions);
    return row;
  }

  function workspaceField(label, value) {
    const field = el("div", "workspace-field");
    field.append(
      el("span", "workspace-field-label", label),
      el("span", "workspace-path", value || "Unavailable")
    );
    return field;
  }

  function projectRow(project) {
    const row = el("button", "project-row");
    row.type = "button";
    row.disabled = projectSelecting;
    const name = typeof project.name === "string" && project.name
      ? project.name
      : project.selector;
    row.append(el("span", "project-row-title", name));
    const details = [];
    if (typeof project.selector === "string") details.push(project.selector);
    if (typeof project.description === "string" && project.description) {
      details.push(project.description);
    }
    if (details.length) row.append(el("span", "project-row-detail", details.join(" — ")));
    const aliases = Array.isArray(project.aliases)
      ? project.aliases.filter(alias => typeof alias === "string" && alias)
      : [];
    if (aliases.length) {
      row.append(el(
        "span",
        "project-row-detail",
        `Aliases: ${aliases.join(", ")}`
      ));
    }
    row.addEventListener("click", () => {
      if (typeof project.selector === "string" && project.selector) {
        void selectWorkspace({ path: project.selector });
      }
    });
    return row;
  }

  function renderProjectPicker(project) {
    const section = el("section", "workspace");
    const heading = el("div", "workspace-head");
    heading.append(
      el("h3", "workspace-title", "Choose a workspace"),
      el("p", "workspace-copy", "Attach one project to this chat or work in an isolated scratch directory.")
    );
    section.append(heading);

    const picker = el("div", "project-picker");
    const scratch = el("button", "project-choice");
    scratch.type = "button";
    scratch.disabled = projectSelecting;
    scratch.append(
      el("span", "project-choice-title", "Chat without a project"),
      el("span", "project-choice-detail", "Use a private scratch workspace for files and commands without attaching a repository.")
    );
    scratch.addEventListener("click", () => {
      void selectWorkspace({ withoutProject: true });
    });

    const search = el("input", "project-search");
    search.id = "project-search";
    search.type = "search";
    search.placeholder = "Search projects";
    search.value = projectCatalog.query;
    search.disabled = projectSelecting;
    search.setAttribute("aria-label", "Search projects");
    search.addEventListener("input", () => {
      projectCatalog.query = search.value;
      projectQueryGeneration += 1;
      if (projectSearchTimer !== null) clearTimeout(projectSearchTimer);
      projectSearchTimer = setTimeout(() => {
        projectSearchTimer = null;
        void loadProjects(projectCatalog.query);
      }, 250);
    });

    const results = el("div", "project-results");
    for (const candidate of projectCatalog.projects) results.append(projectRow(candidate));

    const projectFailed = projectCatalog.phase === "error" || projectCatalog.phase === "selection_error";
    const stateClass = projectFailed ? "project-state failure" : "project-state";
    let stateText = "";
    if (projectSelecting) {
      stateText = "Selecting workspace…";
    } else if (projectCatalog.phase === "loading") {
      stateText = projectCatalog.query.trim() ? "Searching projects…" : "Loading projects…";
    } else if (projectCatalog.phase === "error") {
      stateText = `Could not load projects: ${projectCatalog.error || "Unknown error"}`;
    } else if (projectCatalog.phase === "selection_error") {
      stateText = `Could not select workspace: ${projectCatalog.error || "Unknown error"}`;
    } else if (projectCatalog.phase === "ready" && projectCatalog.projects.length === 0) {
      stateText = projectCatalog.query.trim()
        ? "No projects matched this search."
        : "No selectable projects were found.";
    }
    const state = el("div", stateClass, stateText);
    const shown = projectCatalog.projects.length;
    const total = Number.isFinite(projectCatalog.total) ? projectCatalog.total : shown;
    const countText = projectCatalog.phase === "ready"
      ? total > shown
        ? `Showing ${shown} of ${total} matches. Refine the search to narrow the list.`
        : `${shown} project${shown === 1 ? "" : "s"}`
      : "";
    const count = el("div", "project-count", countText);
    if (projectCatalog.warnings.length) {
      count.textContent += `${count.textContent ? " · " : ""}${projectCatalog.warnings[0]}`;
    }

    picker.append(scratch, search, results, state, count);
    section.append(picker);
    return section;
  }

  function renderSelectedWorkspace(project) {
    const section = el("section", "workspace");
    const withoutProject = project.status === "without_project";
    const heading = el("div", "workspace-head");
    heading.append(
      el("h3", "workspace-title", withoutProject ? "Chat without a project" : "Project selected"),
      el("p", "workspace-copy", withoutProject
        ? "Structured file operations use this private scratch workspace, and commands start there."
        : project.managedWorktree
          ? "This chat uses an isolated managed worktree."
          : "This chat uses the source checkout directly.")
    );
    section.append(heading);
    if (project.name) section.append(el("div", "workspace-name", project.name));
    const fields = el("div", "workspace-fields");
    fields.append(workspaceField(
      withoutProject ? "Scratch" : project.managedWorktree ? "Worktree" : "Path",
      project.activePath
    ));
    if (!withoutProject && project.managedWorktree && project.sourcePath) {
      fields.append(workspaceField("Source", project.sourcePath));
    }
    section.append(fields);
    return section;
  }

  function renderProjectSection() {
    const project = currentData && currentData.project;
    if (!project || typeof project !== "object") return null;
    if (project.status === "unselected") return renderProjectPicker(project);
    if (project.status === "selected" || project.status === "without_project") {
      return renderSelectedWorkspace(project);
    }
    if (project.status === "check_failed") {
      const section = el("section", "workspace");
      const heading = el("div", "workspace-head");
      heading.append(
        el("h3", "workspace-title", "Workspace status unavailable"),
        el("p", "workspace-copy", project.detail || "Codexify could not read the current workspace binding.")
      );
      section.append(heading);
      return section;
    }
    return null;
  }

  async function loadProjects(query) {
    if (!currentData || !currentData.project || currentData.project.status !== "unselected") return;
    const generation = ++projectQueryGeneration;
    projectCatalog = {
      ...projectCatalog,
      phase: "loading",
      query: String(query || ""),
      error: null
    };
    renderCurrent();
    const startedAt = performance.now();
    try {
      const args = { limit: PROJECT_RESULT_LIMIT };
      const normalizedQuery = projectCatalog.query.trim();
      if (normalizedQuery) args.query = normalizedQuery;
      const result = await callTool("list_projects", args);
      if (generation !== projectQueryGeneration) return;
      const failure = toolFailureText(result);
      if (failure) throw new Error(failure);
      const listing = projectListPayload(result);
      if (!listing) throw new Error("The project catalogue result was incomplete.");
      captureTiming("list_projects", result, startedAt);
      projectCatalog = {
        phase: "ready",
        query: normalizedQuery,
        projects: listing.projects.filter(candidate =>
          candidate && typeof candidate.selector === "string" && candidate.selector
        ),
        total: listing.total,
        warnings: Array.isArray(listing.warnings) ? listing.warnings.slice(0, 8) : [],
        error: null
      };
    } catch (error) {
      if (generation !== projectQueryGeneration) return;
      projectCatalog = {
        ...projectCatalog,
        phase: "error",
        projects: [],
        total: 0,
        warnings: [],
        error: errorText(error)
      };
    }
    renderCurrent();
  }

  async function selectWorkspace(argumentsValue) {
    if (projectSelecting || !currentData) return;
    if (projectSearchTimer !== null) {
      clearTimeout(projectSearchTimer);
      projectSearchTimer = null;
    }
    projectQueryGeneration += 1;
    projectSelecting = true;
    renderCurrent();
    const startedAt = performance.now();
    try {
      const result = await callTool("set_project_root", argumentsValue);
      const failure = toolFailureText(result);
      if (failure) throw new Error(failure);
      const selection = projectSelectionPayload(result);
      if (!selection) throw new Error("The workspace-selection result was incomplete.");
      captureTiming("set_project_root", result, startedAt);
      const project = projectStateFromSelection(selection);
      currentData = {
        ...currentData,
        project,
        nextStep: project.status === "without_project"
          ? "Call get_agent_brief before using the private scratch workspace."
          : "Call get_agent_brief before using project tools."
      };
      projectCatalog = {
        phase: "idle",
        query: "",
        projects: [],
        total: 0,
        warnings: [],
        error: null
      };
    } catch (error) {
      projectCatalog = {
        ...projectCatalog,
        phase: "selection_error",
        error: errorText(error)
      };
    } finally {
      projectSelecting = false;
      renderCurrent();
    }
  }

  function maybeStartProjectLoad() {
    const canCall = initialized || (window.openai && typeof window.openai.callTool === "function");
    if (!canCall || !currentData || !currentData.project) return;
    if (currentData.project.status !== "unselected" || projectCatalog.phase !== "idle") return;
    void loadProjects(projectCatalog.query);
  }

  function problemChecks(report) {
    if (!report || !Array.isArray(report.checks)) return [];
    return report.checks
      .filter(check => check && (check.status === "failure" || check.status === "warning"))
      .sort((left, right) => {
        const rank = { failure: 0, warning: 1 };
        return (rank[left.status] || 0) - (rank[right.status] || 0);
      });
  }

  function doctorSummary(report) {
    const summary = report && report.summary ? report.summary : {};
    const failures = Number(summary.failures || 0);
    const warnings = Number(summary.warnings || 0);
    if (failures > 0) {
      return {
        text: `Doctor: ${plural(failures, "failure", "failures")}${warnings ? ` · ${plural(warnings, "warning", "warnings")}` : ""}`,
        tone: "failure"
      };
    }
    if (warnings > 0) {
      return { text: `Doctor: ${plural(warnings, "warning", "warnings")}`, tone: "warning" };
    }
    return { text: "Doctor: healthy", tone: "pass" };
  }

  function renderDoctorCheck(check) {
    const status = ["pass", "warning", "failure", "skipped"].includes(check.status)
      ? check.status
      : "skipped";
    const node = el("div", "doctor-check");
    const heading = el("div", "check-heading");
    const copy = el("div", "check-copy");
    copy.append(
      el("span", "check-id", check.id || "check"),
      document.createTextNode(` — ${check.summary || "No summary"}`)
    );
    heading.append(
      el("span", `check-status status-${status}`, status.toUpperCase()),
      copy
    );
    node.append(heading);
    if (check.detail) node.append(el("div", "check-detail", check.detail));
    if (check.remediation) {
      node.append(el("div", "check-remediation", `Remediation: ${check.remediation}`));
    }
    return node;
  }

  function toggleDoctorDetails() {
    if (!doctorState.expanded) {
      doctorState.expanded = true;
    } else if (!doctorState.showAll) {
      doctorState.showAll = true;
    } else {
      doctorState.expanded = false;
      doctorState.showAll = false;
    }
    renderCurrent();
  }

  function renderDoctorPanel() {
    if (doctorState.phase === "idle") return null;
    if (doctorState.phase === "running" && !doctorState.manual) return null;

    if (doctorState.phase === "error") {
      const panel = el("section", "doctor-panel failure");
      const summary = el("div", "doctor-summary");
      summary.append(
        el("div", "doctor-summary-text status-failure", "Doctor could not run"),
        el("div", "status-failure", doctorState.error || "Unknown error")
      );
      panel.append(summary);
      return panel;
    }

    if (doctorState.phase === "running") {
      const panel = el("section", "doctor-panel");
      const summary = el("div", "doctor-summary");
      summary.append(el("div", "doctor-summary-text status-muted", "Doctor: running…"));
      panel.append(summary);
      return panel;
    }

    const report = doctorState.report;
    if (!report) return null;
    const summaryView = doctorSummary(report);
    const problems = problemChecks(report);
    if (!doctorState.manual && problems.length === 0) return null;

    const panelTone = summaryView.tone === "failure"
      ? " failure"
      : summaryView.tone === "warning" ? " warning" : "";
    const panel = el("section", `doctor-panel${panelTone}`);
    const summary = el("div", "doctor-summary");
    const actions = el("div", "doctor-actions");
    summary.append(el("div", `doctor-summary-text status-${summaryView.tone}`, summaryView.text));

    if (problems.length) {
      actions.append(actionButton(
        actionState.pending && actionState.kind === "autofix" ? "Sending…" : "Autofix",
        summaryView.tone === "failure" ? "failure" : "warning",
        () => { void sendAutofixPrompt(); },
        actionState.pending
      ));
    }
    const detailsLabel = !doctorState.expanded
      ? "Details"
      : doctorState.showAll ? "Hide details" : "Show all checks";
    actions.append(actionButton(detailsLabel, "", toggleDoctorDetails, false));
    summary.append(actions);
    panel.append(summary);

    if (doctorState.expanded) {
      const details = el("div", "doctor-details");
      const checks = doctorState.showAll || doctorState.manual
        ? report.checks || []
        : problems;
      for (const check of checks) details.append(renderDoctorCheck(check));
      panel.append(details);
    }
    return panel;
  }

  function renderFeedback() {
    if (!actionState.message) return null;
    const tone = actionState.tone ? ` ${actionState.tone}` : "";
    return el("div", `feedback${tone}`, actionState.message);
  }

  function refreshDebugFooter() {
    const debug = document.getElementById("debug");
    if (!debug || !currentData || !currentData.debug) return;
    debug.textContent = debugEntries.join(" · ");
    debug.classList.toggle("visible", debugEntries.length > 0);
  }

  function renderCurrent() {
    if (!currentData) return;
    const previousSearch = document.getElementById("project-search");
    const restoreSearch = previousSearch === document.activeElement
      ? {
          start: previousSearch.selectionStart,
          end: previousSearch.selectionEnd
        }
      : null;
    root.replaceChildren();
    const card = el("section", "card");
    const projectSection = renderProjectSection();
    if (projectSection) card.append(projectSection);
    const statuses = el("div", "status-list");
    statuses.append(renderUpdateRow(), renderSchemaRow());
    card.append(statuses);

    const doctorPanel = renderDoctorPanel();
    if (doctorPanel) card.append(doctorPanel);

    const utility = el("div", "utility-actions");
    const doctorRunningManually = doctorState.phase === "running" && doctorState.manual;
    utility.append(actionButton(
      doctorRunningManually ? "Running doctor…" : "Doctor",
      "",
      () => {
        if (doctorState.phase === "running") {
          doctorState.manual = true;
          doctorState.expanded = true;
          doctorState.showAll = true;
          renderCurrent();
          return;
        }
        void runDoctor(true);
      },
      doctorRunningManually
    ));
    card.append(utility);

    const feedback = renderFeedback();
    if (feedback) card.append(feedback);
    const debug = el("div", "debug");
    debug.id = "debug";
    card.append(debug);
    root.append(card);
    refreshDebugFooter();
    if (restoreSearch) {
      const nextSearch = document.getElementById("project-search");
      if (nextSearch && !nextSearch.disabled) {
        nextSearch.focus();
        if (restoreSearch.start !== null && restoreSearch.end !== null) {
          nextSearch.setSelectionRange(restoreSearch.start, restoreSearch.end);
        }
      }
    }
    scheduleSizeReport();
  }

  function isUpdatePayload(payload) {
    return payload
      && typeof payload.status === "string"
      && typeof payload.currentVersion === "string"
      && Object.prototype.hasOwnProperty.call(payload, "latestVersion");
  }

  function isDoctorPayload(payload) {
    return payload
      && typeof payload.ok === "boolean"
      && Array.isArray(payload.checks)
      && payload.summary
      && typeof payload.summary === "object";
  }

  async function runUpdateCheck() {
    if (updateChecking || upgradeRunning) return;
    updateChecking = true;
    actionState = { kind: "updates", message: null, tone: null, pending: false };
    renderCurrent();
    const startedAt = performance.now();
    try {
      const result = await callTool("check_for_updates", {});
      const payload = structuredPayload(result, isUpdatePayload);
      if (!payload) throw new Error("Update check returned no structured status.");
      captureTiming("check_for_updates", result, startedAt);
      updateState = payload;
    } catch (error) {
      const currentVersion = updateState && updateState.currentVersion
        ? updateState.currentVersion
        : currentData.serverVersion || "unknown";
      updateState = {
        status: "check_failed",
        currentVersion,
        latestVersion: null,
        source: null,
        detail: errorText(error)
      };
      actionState = {
        kind: "updates",
        message: `Update check failed: ${errorText(error)}`,
        tone: "warning",
        pending: false
      };
    } finally {
      updateChecking = false;
      renderCurrent();
    }
  }

  async function startUpgrade() {
    if (upgradeRunning || updateChecking) return;
    upgradeRunning = true;
    actionState = {
      kind: "upgrade",
      message: "Preparing verified update…",
      tone: null,
      pending: true
    };
    renderCurrent();
    const startedAt = performance.now();
    try {
      const result = await callTool("self_update", { confirm: true });
      captureTiming("self_update", result, startedAt);
      actionState = {
        kind: "upgrade",
        message: toolText(result),
        tone: null,
        pending: false
      };
    } catch (error) {
      actionState = {
        kind: "upgrade",
        message: `Update failed: ${errorText(error)}`,
        tone: "failure",
        pending: false
      };
    } finally {
      upgradeRunning = false;
      renderCurrent();
    }
  }

  async function runDoctor(manual) {
    if (doctorState.phase === "running") {
      if (manual) {
        doctorState.manual = true;
        doctorState.expanded = true;
        doctorState.showAll = true;
        renderCurrent();
      }
      return;
    }
    doctorState = {
      phase: "running",
      report: doctorState.report,
      error: null,
      expanded: manual || doctorState.expanded,
      showAll: manual || doctorState.showAll,
      manual
    };
    renderCurrent();
    const startedAt = performance.now();
    try {
      const result = await callTool("doctor", {});
      const report = structuredPayload(result, isDoctorPayload);
      if (!report) throw new Error("Doctor returned no structured report.");
      captureTiming("doctor", result, startedAt);
      const showManual = doctorState.manual || manual;
      doctorState = {
        phase: "ready",
        report,
        error: null,
        expanded: showManual || Number(report.summary.failures || 0) > 0,
        showAll: showManual,
        manual: showManual
      };
    } catch (error) {
      doctorState = {
        phase: "error",
        report: null,
        error: errorText(error),
        expanded: true,
        showAll: false,
        manual: doctorState.manual || manual
      };
    }
    renderCurrent();
  }

  function boundedField(value, maxLength) {
    if (value === null || value === undefined) return null;
    return String(value).replace(/\s+/g, " ").trim().slice(0, maxLength);
  }

  function autofixFindings(report) {
    const findings = [];
    for (const check of problemChecks(report).slice(0, 32)) {
      const candidate = {
        id: boundedField(check.id, 128),
        status: check.status,
        summary: boundedField(check.summary, 512),
        detail: boundedField(check.detail, 768),
        remediation: boundedField(check.remediation, 768)
      };
      const next = JSON.stringify([...findings, candidate], null, 2);
      if (next.length > 8000) break;
      findings.push(candidate);
    }
    return JSON.stringify(findings, null, 2);
  }

  function buildAutofixPrompt(report) {
    return `Codexify Doctor found the following warnings/failures:\n\n\`\`\`json\n${autofixFindings(report)}\n\`\`\`\n\nInvestigate the underlying causes and fix everything that is appropriate to fix. Do not blindly apply a remediation if investigation indicates a different root cause. Verify the fixes and rerun Codexify Doctor afterward.`;
  }

  async function sendPrompt(kind, prompt, successMessage) {
    if (actionState.pending) return;
    actionState = { kind, message: "Sending request to ChatGPT…", tone: null, pending: true };
    renderCurrent();
    try {
      await sendFollowUpMessage(prompt);
      actionState = { kind, message: successMessage, tone: null, pending: false };
    } catch (error) {
      actionState = {
        kind,
        message: `Could not send the request: ${errorText(error)}`,
        tone: "failure",
        pending: false
      };
    }
    renderCurrent();
  }

  async function openRefreshSettings() {
    if (actionState.pending) return;
    actionState = { kind: "refresh", message: "Opening connector settings…", tone: null, pending: true };
    renderCurrent();
    try {
      await openLink(refreshSettingsHref());
      actionState = {
        kind: "refresh",
        message: "In ChatGPT settings, select Codexify if needed, scroll below the list of tools, and click Refresh.",
        tone: null,
        pending: false
      };
    } catch (error) {
      actionState = {
        kind: "refresh",
        message: `Could not open connector settings: ${errorText(error)}`,
        tone: "failure",
        pending: false
      };
    }
    renderCurrent();
  }

  async function sendAutofixPrompt() {
    if (!doctorState.report || !problemChecks(doctorState.report).length) return;
    await sendPrompt(
      "autofix",
      buildAutofixPrompt(doctorState.report),
      "Diagnostic findings sent to ChatGPT for repair."
    );
  }

  function maybeStartAutomaticDoctor() {
    const canCall = initialized || (window.openai && typeof window.openai.callTool === "function");
    if (!currentData || !canCall || automaticDoctorStarted) return;
    automaticDoctorStarted = true;
    void runDoctor(false);
  }

  function acceptSetupResult(value) {
    const payload = setupPayload(value);
    if (!payload) return;
    const firstPayload = !currentData;
    currentData = payload;
    currentMetadata = value || currentMetadata;
    if (firstPayload || !updateState) updateState = payload.update || null;
    if (firstPayload) {
      debugEntries = [];
      if (payload.debug && Number.isFinite(payload.debug.updateCheckMs)) {
        addDebugEntry(`setup release check: ${payload.debug.updateCheckMs} ms`);
      }
      const initialTiming = debugPayload(currentMetadata);
      if (initialTiming && Number.isFinite(initialTiming.durationMs)) {
        addDebugEntry(`setup: server ${initialTiming.durationMs} ms`);
      }
    }
    renderCurrent();
    maybeStartProjectLoad();
    maybeStartAutomaticDoctor();
  }

  window.addEventListener("message", event => {
    if (event.source !== window.parent) return;
    const message = event.data;
    if (!message || message.jsonrpc !== "2.0") return;
    const hasResult = Object.prototype.hasOwnProperty.call(message, "result");
    const hasError = Object.prototype.hasOwnProperty.call(message, "error");
    if (Object.prototype.hasOwnProperty.call(message, "id") && (hasResult || hasError)) {
      const waiter = pending.get(message.id);
      if (!waiter) return;
      pending.delete(message.id);
      hasError ? waiter.reject(message.error) : waiter.resolve(message.result);
      return;
    }
    if (message.method === "ui/notifications/tool-result") {
      acceptSetupResult(message.params);
    } else if (message.method === "ui/notifications/host-context-changed") {
      applyHostContext(message.params);
    } else if (message.method === "ui/resource-teardown" && message.id !== undefined) {
      post({ jsonrpc: "2.0", id: message.id, result: {} });
    }
  });

  const legacyPayload = setupPayload(window.openai && (
    window.openai.toolResponseMetadata || window.openai.toolOutput
  ));
  if (legacyPayload) {
    acceptSetupResult(window.openai.toolResponseMetadata || window.openai.toolOutput);
  }

  window.addEventListener("openai:set_globals", event => {
    const globals = event.detail && event.detail.globals;
    if (!globals) return;
    acceptSetupResult(globals.toolResponseMetadata || globals.toolOutput);
  });

  ensureResizeObserver();
  request("ui/initialize", {
    protocolVersion: "2026-01-26",
    appInfo: { name: "codexify-setup", version: "2.0.0" },
    appCapabilities: {}
  }).then(result => {
    initialized = true;
    applyHostContext(result && result.hostContext);
    notify("ui/notifications/initialized", {});
    maybeStartProjectLoad();
    maybeStartAutomaticDoctor();
    reportSize();
  }).catch(error => {
    if (!currentData) {
      root.replaceChildren(el("div", "initialization-error", `Setup UI could not initialize: ${errorText(error)}`));
    }
    maybeStartProjectLoad();
    maybeStartAutomaticDoctor();
    reportSize();
  });
})();
</script>
</body>
</html>
