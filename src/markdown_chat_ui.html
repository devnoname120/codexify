<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown chat</title>
<style>
:root { color-scheme: light dark; --bg:#fff; --surface:#f6f7f8; --ink:#202427; --muted:#697177; --border:#dbe0e3; --user:#e4f3ed; --agent:#f0f2f4; --accent:#136f50; --tick:#6e777d; --read:#0078bc; --error:#ad2d30; --waiting:#c4313b; }
@media (prefers-color-scheme:dark) { :root:not([data-theme="light"]) { --bg:#181b1b; --surface:#232727; --ink:#eef1f1; --muted:#adb7b6; --border:#3a4241; --user:#174c3e; --agent:#2b3130; --accent:#82d9b1; --tick:#b5c0bd; --read:#59c9f6; --error:#ffadae; --waiting:#ff858e; } }
:root[data-theme="dark"] { --bg:#181b1b; --surface:#232727; --ink:#eef1f1; --muted:#adb7b6; --border:#3a4241; --user:#174c3e; --agent:#2b3130; --accent:#82d9b1; --tick:#b5c0bd; --read:#59c9f6; --error:#ffadae; --waiting:#ff858e; }
* { box-sizing:border-box; }
body { margin:0; color:var(--ink); background:transparent; font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
button,textarea { font:inherit; }
button { cursor:pointer; }
button:disabled { cursor:default; opacity:.5; }
button:focus-visible,textarea:focus-visible,a:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
[hidden] { display:none!important; }
:host([hidden]) { display:none!important; }
#chat { max-width:640px; margin:auto; overflow:hidden; border:1px solid var(--border); border-radius:18px; background:var(--bg); }
.header { display:flex; align-items:center; gap:12px; padding:13px 16px; border-bottom:1px solid var(--border); }
.heading { flex:1; min-width:0; }
.header-actions { display:flex; align-items:center; gap:2px; flex:none; }
h1 { display:flex; align-items:center; flex-wrap:wrap; gap:9px; font-size:15px; font-weight:650; margin:0; }
#chat-title { min-width:0; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#presence { display:inline-flex; align-items:center; gap:4px; color:var(--muted); font-size:11px; font-weight:400; }
.presence-symbol { width:14px; height:14px; flex:none; }
.presence-symbol.wake-spinner { animation:stop-spin 2s linear infinite; transform-origin:center; }
#presence[data-state="waiting"] { color:var(--waiting); }
#tool-total { color:var(--muted); font-size:11px; font-weight:400; white-space:nowrap; font-variant-numeric:tabular-nums; }
.subtitle { font-size:12px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#workspace-label { font-size:11px; color:var(--muted); overflow-wrap:anywhere; }
.icon-button { width:34px; height:34px; padding:6px; border:0; background:transparent; color:var(--muted); border-radius:50%; }
svg { display:block; width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
#messages { overflow:auto; overscroll-behavior:contain; max-height:480px; min-height:130px; padding:16px; display:flex; flex-direction:column; gap:12px; scrollbar-width:thin; }
#older { align-self:center; background:transparent; color:var(--accent); border:1px solid var(--border); border-radius:14px; padding:4px 12px; font-size:12px; }
#empty { text-align:center; margin:auto; padding:24px 10px; color:var(--muted); font-size:13px; }
.message { max-width:92%; border-radius:13px; padding:10px 12px 6px; align-self:flex-start; background:var(--agent); min-width:75px; }
.message.user { align-self:flex-end; background:var(--user); border-bottom-right-radius:4px; }
.message.agent { border-bottom-left-radius:4px; }
.warning-banner { align-self:stretch; min-width:0; background:#fff3c4; color:#694b00; border:1px solid #e8c75c; padding:9px 12px; border-radius:8px; }
.message.copy-enabled,.warning-banner.copy-enabled { position:relative; }
.message-tools { position:absolute; top:5px; right:6px; opacity:0; transition:opacity .12s ease; }
.copy-enabled:hover .message-tools,.copy-enabled:focus-within .message-tools { opacity:1; }
.message-tools:has([data-copied="true"]) { opacity:1; }
.message-copy[data-copied="true"],#copy-chat[data-copied="true"] { color:var(--accent); }
.message-copy { width:26px; height:26px; padding:5px; border:1px solid var(--border); border-radius:50%; background:var(--bg); color:var(--muted); }
.message-copy:hover { color:var(--accent); }
@media(hover:none) { .message-tools { opacity:1; } }
:root[data-theme="dark"] .warning-banner { background:#473a19; color:#ffe6a0; border-color:#96742b; }
@media (prefers-color-scheme:dark) { :root:not([data-theme="light"]) .warning-banner { background:#473a19; color:#ffe6a0; border-color:#96742b; } }
.warning-banner .markdown p { margin:0; }
.tool-call-marker { align-self:center; margin:-7px 0; padding:0 6px; color:var(--muted); font-size:10px; line-height:1.25; white-space:nowrap; font-variant-numeric:tabular-nums; }
.goal-completed-event { align-self:stretch; min-width:0; flex:none; border-block:1px solid var(--border); font-size:12px; }
.goal-completed-event > summary { padding:5px 0; line-height:22px; cursor:pointer; direction:rtl; list-style:disclosure-closed inside; color:var(--muted); border-radius:4px; }
.goal-completed-event[open] > summary { list-style-type:disclosure-open; }
.goal-completed-event > summary:hover { background:var(--surface); }
.goal-completed-event > summary:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
.goal-completed-row { display:inline-flex; vertical-align:middle; align-items:center; gap:8px; width:calc(100% - 18px); direction:ltr; }
.goal-completed-label { flex:0 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; color:var(--ink); font-size:13px; font-weight:600; white-space:nowrap; }
.goal-completed-preview { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.goal-completed-event .markdown { min-width:0; padding:5px 24px 12px; color:var(--ink); font-size:13px; line-height:1.55; }
.goal-completed-event svg { width:16px; height:16px; flex:none; color:#159b27; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.goal-blocked-event svg { color:var(--danger,#c23b46); }
.goal-completed-event .receipt { flex:none; min-height:0; margin:0 0 0 auto; white-space:nowrap; font-size:11px; color:var(--muted); }
@media(max-width:480px) { .goal-completed-preview { display:none; } .goal-completed-row { gap:6px; } }
.author { font-size:11px; font-weight:650; margin-bottom:3px; color:var(--muted); }
.markdown { overflow-wrap:anywhere; min-width:0; }
.markdown p { margin:0 0 7px; white-space:pre-wrap; }
.markdown p:last-child { margin-bottom:0; }
.markdown h2,.markdown h3,.markdown h4 { font-size:1em; margin:8px 0 4px; }
.markdown h2:first-child,.markdown h3:first-child,.markdown h4:first-child { margin-top:0; }
.markdown ul,.markdown ol { margin:5px 0; padding-left:20px; }
.markdown blockquote { margin:6px 0; padding:2px 9px; border-left:2px solid var(--muted); }
.markdown pre { white-space:pre-wrap; overflow-wrap:anywhere; padding:10px; border-radius:8px; background:var(--bg); overflow:auto; margin:8px 0; }
.markdown code { font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace; }
.markdown :not(pre)>code { background:var(--bg); padding:1px 4px; border-radius:4px; }
.markdown a { color:var(--accent); text-decoration:underline; }
.markdown .table-scroll { max-width:100%; overflow-x:auto; margin:8px 0; }
.markdown table { border-collapse:collapse; width:100%; font-size:12px; }
.markdown th,.markdown td { border:1px solid var(--border); padding:6px 8px; min-width:70px; }
.markdown th { background:var(--surface); font-weight:650; }
.markdown .attachment-link { text-decoration-style:dotted; }
.markdown a[aria-busy="true"] { opacity:.6; }
.markdown .image-reference { display:inline-block; border:1px solid var(--border); padding:4px 8px; border-radius:6px; }
.receipt { display:flex; align-items:center; justify-content:flex-end; min-height:20px; margin-top:3px; gap:5px; color:var(--muted); font-size:11px; }
.message-time { flex:none; white-space:nowrap; font-variant-numeric:tabular-nums; }
.ticks { width:22px; height:15px; color:var(--tick); }
.ticks.read { color:var(--read); }
.retry { border:0; background:transparent; color:var(--error); padding:0 4px; font-size:12px; }
.footer { border-top:1px solid var(--border); padding:10px 12px 9px; background:var(--surface); }
#queued-messages { max-height:min(200px,28dvh); overflow:auto; border:1px solid var(--border); border-radius:14px; margin:0 2px 8px; padding:3px 5px; background:var(--bg); }
.queued-message { display:grid; grid-template-columns:16px minmax(0,1fr) auto; align-items:center; gap:7px; padding:6px 4px; font-size:13px; }
.queued-message > svg { width:16px; height:16px; color:var(--muted); }
.queued-message-preview { display:flex; align-items:center; min-width:0; gap:6px; }
.queued-message-text { min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.queued-actions,.queued-edit-actions { display:flex; align-items:center; gap:3px; }
.queued-actions button,.queued-edit-actions button { border:0; border-radius:5px; background:transparent; color:var(--muted); padding:5px; font-size:12px; }
.queued-actions button { display:inline-flex; align-items:center; justify-content:center; gap:4px; min-height:28px; }
.queued-actions button:hover,.queued-edit-actions button:hover { color:var(--ink); background:var(--surface); }
.queued-actions svg { width:15px; height:15px; flex:none; }

.queued-editor { grid-column:2/-1; min-width:0; }
.queued-editor textarea { width:100%; min-height:64px; max-height:120px; resize:vertical; padding:7px; background:var(--bg); color:var(--ink); border:1px solid var(--border); border-radius:7px; font:inherit; }
.queued-error { grid-column:2/-1; margin:0; color:var(--error); font-size:11px; }
.queued-attachments { display:flex; gap:3px; flex:none; }
.queued-attachments .attachment-card { width:26px; height:26px; padding:0; border-radius:4px; }
.queued-attachments .attachment-visual { width:26px; height:26px; border-radius:4px; }
.queued-attachments .attachment-visual svg { width:18px; height:18px; }
.queued-attachments .attachment-name,.queued-attachments .attachment-size { display:none; }
#retained-sends { margin:0 0 9px; color:var(--muted); font-size:11px; }
#retained-sends p { margin:6px 0; white-space:pre-wrap; overflow-wrap:anywhere; }
#composer { position:relative; display:flex; gap:8px; align-items:flex-end; }
#draft { flex:1; width:0; min-width:0; max-height:150px; resize:none; border:1px solid var(--border); border-radius:19px; background:var(--bg); color:var(--ink); padding:9px 13px; line-height:1.4; }
#chat[data-awaiting="true"] #draft { border-color:var(--waiting); box-shadow:0 0 0 1px var(--waiting); }
#chat[data-awaiting="true"] #draft:focus-visible { outline-color:var(--waiting); }
#awaiting-hint { margin:0 4px 8px; color:var(--waiting); font-size:12px; font-weight:500; }
#retired-hint { margin:0 4px 8px; color:var(--error); font-size:12px; font-weight:500; }
#send { flex:0 0 38px; width:38px; height:38px; border:0; border-radius:50%; background:var(--accent); color:var(--bg); padding:9px; }
#send { -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; touch-action:manipulation; }
#send-mode-menu { position:absolute; z-index:30; right:0; width:190px; max-width:calc(100% - 8px); padding:5px; border:1px solid var(--border); border-radius:16px; background:var(--bg); color:var(--ink); box-shadow:0 8px 30px #0002; }
#send-mode-menu button { display:flex; align-items:center; gap:10px; width:100%; min-height:42px; padding:9px 12px; border:0; border-radius:11px; background:transparent; color:inherit; font:inherit; text-align:left; touch-action:manipulation; }
#send-mode-menu button:is(:hover,:focus-visible),#send-mode-menu button[data-default="true"] { background:var(--surface); }
#send-mode-menu svg { width:19px; height:19px; flex:none; }
.draft-attachments,.message-attachments { display:flex; gap:10px; overflow-x:auto; padding:4px 2px; min-width:0; }
.draft-attachments { flex:1 0 100%; grid-column:1/-1; grid-row:1; }
#composer:has(.draft-attachments:not([hidden])) { flex-wrap:wrap; }
#composer:has(.draft-attachments:not([hidden])) #draft { grid-row:2; }
#composer:has(.draft-attachments:not([hidden])) #composer-tools,#composer:has(.draft-attachments:not([hidden])) #send { grid-row:3; }
.message-attachments { margin:8px 0; }
.draft-attachment { position:relative; flex:none; }
.attachment-card { flex:none; width:160px; height:140px; display:flex; flex-direction:column; align-items:stretch; gap:3px; padding:8px; text-align:left; border:1px solid var(--border); border-radius:12px; color:var(--ink); background:var(--bg); font:inherit; cursor:pointer; }
.attachment-visual { display:flex; align-items:center; justify-content:center; height:86px; flex:none; overflow:hidden; border-radius:7px; }
.attachment-visual img { width:100%; height:100%; object-fit:cover; }
.attachment-visual svg { width:34px; height:34px; color:var(--muted); }
.attachment-name { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; font-weight:600; }
.attachment-size { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:11px; color:var(--muted); }
.attachment-remove { position:absolute; top:3px; right:3px; width:23px; height:23px; display:grid; place-items:center; padding:0; border:1px solid var(--border); border-radius:50%; background:var(--surface); color:var(--ink); cursor:pointer; }
.attachment-remove svg { width:14px; height:14px; stroke-width:2.5; }
.attachment-upload-retry { position:absolute; left:8px; bottom:5px; border:0; background:var(--surface); color:var(--ink); font:inherit; font-size:11px; cursor:pointer; }
.attach-button { flex:none; display:grid; place-items:center; }
.attach-button svg { width:17px; height:17px; stroke-width:1.6; }
.attachment-drop-overlay { position:fixed; inset:0; z-index:20000; display:grid; place-items:center; padding:24px; background:#102822df; color:#fff; outline:3px dashed #8ce4b4; outline-offset:-20px; pointer-events:none; font-size:24px; font-weight:600; text-align:center; }
.attachment-viewer { position:fixed; inset:0; z-index:10001; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; padding:65px 24px 24px; background:#000e; color:#fff; }
.attachment-viewer img,.attachment-viewer video { flex:1; min-height:0; width:95vw; height:calc(100dvh - 140px); max-width:95vw; max-height:calc(100dvh - 140px); object-fit:contain; }
.attachment-viewer-close { position:absolute; top:15px; right:20px; width:38px; height:38px; display:grid; place-items:center; padding:0; border:0; border-radius:50%; color:#fff; background:#ffffff20; cursor:pointer; }
.attachment-viewer-close svg { width:24px; height:24px; stroke-width:2.5; }
.attachment-viewer-download { position:absolute; top:25px; left:24px; color:#fff; font-size:14px; }
.attachment-viewer-name { max-width:90vw; overflow-wrap:anywhere; text-align:center; font-size:13px; }
#send .stop-spinner { animation:stop-spin .8s linear infinite; }
@keyframes stop-spin { to { transform:rotate(360deg); } }
#status { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:11px; margin:7px 4px 0; }
#status.error { color:var(--error); }
#refresh { border:0; background:transparent; color:inherit; text-decoration:underline; padding:0 3px; font-size:11px; }
@media(max-width:400px) { .header { padding:11px 12px; } #messages { padding:12px; max-height:420px; } .message { max-width:96%; } #draft { font-size:16px; } }
</style>
</head>
<body>
<section id="chat" aria-label="Markdown chat for this conversation">
  <header class="header">
    <div class="heading"><h1><span id="chat-title">Agent</span><span id="presence" role="status"></span><span id="tool-total" hidden></span></h1><div id="chat-subtitle" class="subtitle">Markdown chat · This Codexify task</div><div id="workspace-label" hidden></div></div>
    <div class="header-actions">
      <button id="copy-chat" class="icon-button" aria-label="Copy whole chat as Markdown" title="Copy whole chat as Markdown" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7h11v13H8z"/><path d="M5 17H3V4h12v2"/></svg></button>
    </div>
  </header>
  <div id="panel">
    <div id="messages" role="log" aria-label="Chat messages" aria-live="polite" aria-relevant="additions">
      <button id="older" hidden>Load earlier messages</button>
      <div id="empty">Loading this conversation...</div>
    </div>
    <div class="footer">
      <section id="queued-messages" aria-label="Queued messages" hidden></section>
      <details id="retained-sends" hidden><summary id="retained-summary"></summary><div id="retained-messages"></div></details>
      <p id="retired-hint" hidden>This task continued in another ChatGPT conversation. This chat is read-only here.</p>
      <p id="awaiting-hint" hidden>The agent is waiting for your message.</p>
      <form id="composer">
        <textarea id="draft" rows="1" aria-label="Message the agent" placeholder="Message the agent..." spellcheck="true"></textarea>
        <button id="send" type="submit" aria-label="Send message" title="Send message" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
        <div id="send-mode-menu" role="menu" aria-label="Send message as" hidden>
          <button type="button" role="menuitem" data-mode="steer" tabindex="-1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5v7h15m-5-5 5 5-5 5"/></svg><span>Steer</span></button>
          <button type="button" role="menuitem" data-mode="queue" tabindex="-1"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6M4 8h6M4 12v3h15m-4-4 4 4-4 4"/></svg><span>Queue</span></button>
        </div>
      </form>
      <div id="status" role="status"><span id="status-text">Enter to send. Shift + Enter for a new line.</span><button id="refresh" hidden>Retry connection</button></div>
    </div>
  </div>
</section>
<script>
/* CODEXIFY_MARKDOWN_LIBRARY */
/* CODEXIFY_MARKDOWN_RENDERER */
/* CODEXIFY_ATTACHMENT_COMPOSER */
(() => {
  "use strict";
  function mountChat(scope, bridge = null) {
  const META = "io.github.devnoname120/codexify/markdown-chat";
  const el = id => scope.getElementById(id);
  const list = el("messages"), input = el("draft"), send = el("send"), older = el("older");
  const canCopyMessage = typeof bridge?.copyMessage === "function";
  const canCopyChat = typeof bridge?.copyChat === "function";
  const records = new Map(), nodes = new Map(), markerNodes = new Map(), pendingSends = new Map(), rpcPending = new Map();
  let rpcId = 1, initialized = false, tornDown = false, pollTimer = null, saveTimer = null;
  let refreshing = false, sending = false, loadingOlder = false, visible = true;
  let revision = null, before = null, hasMore = false, delivered = 0, readThrough = 0, chatFile = null, failures = 0, snapshotEnd = 0;
  let lastAgentCall = null, totalToolCalls = null, clockOffset = 0, presenceTimer = null, offlineAfterMs = 300000;
  let waitingForPresenceRefresh = false;
  let wakeStatus = null, wakeVersion = 0;
  let agentWaitingUntil = null, agentPresenceUntil = null, waitingReplyEnd = 0, inputRequired = false;
  let agentStopped = false, stopping = false, stopRequestId = null;
  let messageClockTimer = null;
  let hostCapabilities = {};
  let queuedMessages = [], defaultMessageMode = "steer", messageModeVersion = 0, queueVersion = 0, submitMode = null;
  let queueEdit = null;
  const sendMenu = el("send-mode-menu");
  let sendPress = null, suppressSendClick = false, sendMenuFocus = null, menuTouchSelection = false;
  const queueNodes = new Map(), queueBusy = new Set();
  const primaryModifier = /Mac|iPhone|iPad/.test(navigator.platform || "") ? "metaKey" : "ctrlKey";
  const modifierLabel = primaryModifier === "metaKey" ? "Cmd" : "Ctrl";
  let statusKind = "normal";
  let available = bridge === null;
  let runtimeLoading = null;
  let externalReadOnly = false, pageRetired = false;
  let workspace, generation = 0;
  const saved = (bridge?.getState?.() || window.openai?.widgetState)?.privateContent || {};
  const attachments = typeof bridge?.uploadAttachment === "function" ? new window.CodexifyChatAttachments({
    scope, bridge, saved:saved.draftAttachments, changed:() => { resizeInput(); save(); },
    error:message => status(message,true,"action",false),
    canOperate:() => !tornDown && available && !isReadOnly() && Boolean(chatFile) && !sending && !stopping,
  }) : null;
  input.value = typeof saved.draft === "string" ? saved.draft : "";
  for (const message of Array.isArray(saved.pending) ? saved.pending : []) {
    if (typeof message.id === "string" && typeof message.markdown === "string") {
      pendingSends.set(message.id, { ...message, chat_file:message.chat_file || saved.chat_file || null, failed:true, pending:false });
    }
  }

  function make(tag, className = "", text) {
    const node = document.createElement(tag);
    node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }
  function icon(paths, className = "") {
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 24 18");
    svg.setAttribute("aria-hidden", "true");
    if (className) svg.setAttribute("class", className);
    for (const d of paths) {
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", d); svg.append(path);
    }
    return svg;
  }
  function queueSymbol(paths, className = "") { const mark = icon(paths,className); mark.setAttribute("viewBox","0 0 24 24"); return mark; }
  function awaitingAnswer() {
    return inputRequired || Number.isSafeInteger(agentWaitingUntil) && Date.now() + clockOffset < agentWaitingUntil;
  }
  function composerMessageMode() {
    return awaitingAnswer() ? "steer" : defaultMessageMode;
  }
  function messageHint() {
    if (startupBlocked()) return runtimeLoading.detail || "Codexify is starting.";
    if (awaitingAnswer()) return `Enter or ${modifierLabel}+Enter to send your answer. Shift + Enter for a new line.`;
    return composerMessageMode() === "queue" ? `Enter to queue. ${modifierLabel}+Enter to steer. Shift + Enter for a new line.` : `Enter to send. ${modifierLabel}+Enter to queue. Shift + Enter for a new line.`;
  }
  function changeMessageMode(mode) {
    if (!["steer","queue"].includes(mode)) return;
    defaultMessageMode = mode; resizeInput();
    if (statusKind === "normal") status(messageHint(),false,"normal");
  }
  const modeChanged = event => { messageModeVersion++; changeMessageMode(event.detail); };
  window.addEventListener("codexify-message-mode-change",modeChanged);
  function acceptQueue(messages) {
    if (!Array.isArray(messages)) return;
    if (messages.some(message=>typeof message.id!=="string" || typeof message.markdown!=="string" || !Number.isSafeInteger(message.revision))) throw new Error("Invalid private message queue");
