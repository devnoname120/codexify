<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown chat</title>
<style>
:root { color-scheme: light dark; --bg:#fff; --surface:#f6f7f8; --ink:#202427; --muted:#697177; --border:#dbe0e3; --user:#e4f3ed; --agent:#f0f2f4; --accent:#136f50; --tick:#6e777d; --read:#0078bc; --error:#ad2d30; }
@media (prefers-color-scheme:dark) { :root:not([data-theme="light"]) { --bg:#181b1b; --surface:#232727; --ink:#eef1f1; --muted:#adb7b6; --border:#3a4241; --user:#174c3e; --agent:#2b3130; --accent:#82d9b1; --tick:#b5c0bd; --read:#59c9f6; --error:#ffadae; } }
:root[data-theme="dark"] { --bg:#181b1b; --surface:#232727; --ink:#eef1f1; --muted:#adb7b6; --border:#3a4241; --user:#174c3e; --agent:#2b3130; --accent:#82d9b1; --tick:#b5c0bd; --read:#59c9f6; --error:#ffadae; }
* { box-sizing:border-box; }
body { margin:0; color:var(--ink); background:transparent; font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
button,textarea { font:inherit; }
button { cursor:pointer; }
button:disabled { cursor:default; opacity:.5; }
button:focus-visible,textarea:focus-visible,a:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
[hidden] { display:none!important; }
:host([hidden]) { display:none!important; }
#chat { max-width:640px; margin:auto; overflow:hidden; border:1px solid var(--border); border-radius:18px; background:var(--bg); }
.header { display:flex; align-items:center; gap:12px; padding:13px 16px; border-bottom:1px solid var(--border); }
.heading { flex:1; min-width:0; }
h1 { display:flex; align-items:center; flex-wrap:wrap; gap:9px; font-size:15px; font-weight:650; margin:0; }
#presence { display:inline-flex; align-items:center; gap:4px; color:var(--muted); font-size:11px; font-weight:400; }
.presence-symbol { width:14px; height:14px; flex:none; }
.subtitle { font-size:12px; color:var(--muted); }
.icon-button { width:34px; height:34px; padding:6px; border:0; background:transparent; color:var(--muted); border-radius:50%; }
svg { display:block; width:100%; height:100%; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
#messages { overflow:auto; overscroll-behavior:contain; max-height:480px; min-height:130px; padding:16px; display:flex; flex-direction:column; gap:12px; scrollbar-width:thin; }
#older { align-self:center; background:transparent; color:var(--accent); border:1px solid var(--border); border-radius:14px; padding:4px 12px; font-size:12px; }
#empty { text-align:center; margin:auto; padding:24px 10px; color:var(--muted); font-size:13px; }
.message { max-width:92%; border-radius:13px; padding:10px 12px 6px; align-self:flex-start; background:var(--agent); min-width:75px; }
.message.user { align-self:flex-end; background:var(--user); border-bottom-right-radius:4px; }
.message.agent { border-bottom-left-radius:4px; }
.author { font-size:11px; font-weight:650; margin-bottom:3px; color:var(--muted); }
.markdown { overflow-wrap:anywhere; min-width:0; }
.markdown p { margin:0 0 7px; white-space:pre-wrap; }
.markdown p:last-child { margin-bottom:0; }
.markdown h2,.markdown h3,.markdown h4 { font-size:1em; margin:8px 0 4px; }
.markdown h2:first-child,.markdown h3:first-child,.markdown h4:first-child { margin-top:0; }
.markdown ul,.markdown ol { margin:5px 0; padding-left:20px; }
.markdown blockquote { margin:6px 0; padding:2px 9px; border-left:2px solid var(--muted); }
.markdown pre { white-space:pre-wrap; overflow-wrap:anywhere; padding:10px; border-radius:8px; background:var(--bg); overflow:auto; margin:8px 0; }
.markdown code { font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace; }
.markdown :not(pre)>code { background:var(--bg); padding:1px 4px; border-radius:4px; }
.markdown a { color:var(--accent); text-decoration:underline; }
.markdown .table-scroll { max-width:100%; overflow-x:auto; margin:8px 0; }
.markdown table { border-collapse:collapse; width:100%; font-size:12px; }
.markdown th,.markdown td { border:1px solid var(--border); padding:6px 8px; min-width:70px; }
.markdown th { background:var(--surface); font-weight:650; }
.markdown .attachment-link { text-decoration-style:dotted; }
.markdown a[aria-busy="true"] { opacity:.6; }
.markdown .image-reference { display:inline-block; border:1px solid var(--border); padding:4px 8px; border-radius:6px; }
.receipt { display:flex; align-items:center; justify-content:flex-end; min-height:20px; margin-top:3px; gap:5px; color:var(--muted); font-size:11px; }
.message-time { flex:none; white-space:nowrap; font-variant-numeric:tabular-nums; }
.ticks { width:22px; height:15px; color:var(--tick); }
.ticks.read { color:var(--read); }
.retry { border:0; background:transparent; color:var(--error); padding:0 4px; font-size:12px; }
.footer { border-top:1px solid var(--border); padding:10px 12px 9px; background:var(--surface); }
#composer { display:flex; gap:8px; align-items:flex-end; }
#draft { flex:1; width:0; min-width:0; max-height:150px; resize:none; border:1px solid var(--border); border-radius:19px; background:var(--bg); color:var(--ink); padding:9px 13px; line-height:1.4; }
#send { flex:0 0 38px; width:38px; height:38px; border:0; border-radius:50%; background:var(--accent); color:var(--bg); padding:9px; }
#status { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:11px; margin:7px 4px 0; }
#status.error { color:var(--error); }
#refresh { border:0; background:transparent; color:inherit; text-decoration:underline; padding:0 3px; font-size:11px; }
@media(max-width:400px) { .header { padding:11px 12px; } #messages { padding:12px; max-height:420px; } .message { max-width:96%; } #draft { font-size:16px; } }
</style>
</head>
<body>
<section id="chat" aria-label="Markdown chat for this conversation">
  <header class="header">
    <div class="heading"><h1>Agent <span id="presence" role="status"></span></h1><div class="subtitle">Markdown chat · This conversation only</div></div>
    <button id="collapse" class="icon-button" aria-label="Collapse chat" aria-expanded="true" title="Collapse chat"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 14 6-6 6 6"/></svg></button>
  </header>
  <div id="panel">
    <div id="messages" role="log" aria-label="Chat messages" aria-live="polite" aria-relevant="additions">
      <button id="older" hidden>Load earlier messages</button>
      <div id="empty">Loading this conversation...</div>
    </div>
    <div class="footer">
      <form id="composer">
        <textarea id="draft" rows="1" aria-label="Message the agent" placeholder="Message the agent..." spellcheck="true"></textarea>
        <button id="send" type="submit" aria-label="Send message" title="Send message" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button>
      </form>
      <div id="status" role="status"><span id="status-text">Enter to send. Shift + Enter for a new line.</span><button id="refresh" hidden>Retry connection</button></div>
    </div>
  </div>
</section>
<script>
/* CODEXIFY_MARKDOWN_LIBRARY */
/* CODEXIFY_MARKDOWN_RENDERER */
(() => {
  "use strict";
  function mountChat(scope, bridge = null) {
  const META = "io.github.devnoname120/codexify/markdown-chat";
  const el = id => scope.getElementById(id);
  const list = el("messages"), input = el("draft"), send = el("send"), older = el("older");
  const records = new Map(), nodes = new Map(), pendingSends = new Map(), rpcPending = new Map();
  let rpcId = 1, initialized = false, tornDown = false, pollTimer = null, saveTimer = null;
  let refreshing = false, sending = false, loadingOlder = false, visible = true, collapsed = false;
  let revision = null, before = null, hasMore = false, delivered = 0, readThrough = 0, chatFile = null, failures = 0, snapshotEnd = 0;
  let lastAgentCall = null, clockOffset = 0, presenceTimer = null;
  let messageClockTimer = null;
  let hostCapabilities = {};
  let statusKind = "normal";
  let available = bridge === null;
  const saved = window.openai?.widgetState?.privateContent || {};
  input.value = typeof saved.draft === "string" ? saved.draft : "";
  collapsed = saved.collapsed === true;
  for (const message of Array.isArray(saved.pending) ? saved.pending : []) {
    if (typeof message.id === "string" && typeof message.markdown === "string") {
      pendingSends.set(message.id, { ...message, failed:true, pending:false });
    }
  }

  function make(tag, className = "", text) {
    const node = document.createElement(tag);
    node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }
  function icon(paths, className = "") {
    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
    svg.setAttribute("viewBox", "0 0 24 18");
    svg.setAttribute("aria-hidden", "true");
    if (className) svg.setAttribute("class", className);
    for (const d of paths) {
      const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
      path.setAttribute("d", d); svg.append(path);
    }
    return svg;
  }
  function post(message) { window.parent.postMessage({ jsonrpc:"2.0", ...message }, "*"); }
  function rpc(method, params, timeout = 8000) {
    return new Promise((resolve, reject) => {
      const id = rpcId++;
      const timer = setTimeout(() => { rpcPending.delete(id); reject(new Error("The connector did not respond. Your unsent message is retained.")); }, timeout);
      rpcPending.set(id, { resolve, reject, timer });
      post({ id, method, params });
    });
  }
  async function call(name, args) {
    if (tornDown) throw new Error("This widget has closed.");
    let result;
    if (bridge) {
      result = await bridge.callTool(name, args, 8000);
    } else if (typeof window.openai?.callTool === "function") {
      let timer;
      try {
        result = await Promise.race([
          window.openai.callTool(name, args),
          new Promise((_, reject) => { timer = setTimeout(() => reject(new Error("The connector did not respond. Retry uses the same message ID.")), 8000); })
        ]);
      } finally { clearTimeout(timer); }
    } else if (initialized) {
      result = await rpc("tools/call", { name, arguments:args });
    } else { throw new Error("Waiting for the widget connection."); }
    const queue = [result], seen = new Set();
    let payload;
    for (let i = 0; i < queue.length && i < 64; i++) {
      const value = queue[i];
      if (!value || typeof value !== "object" || seen.has(value)) continue;
      seen.add(value);
      if (value.isError || value.is_error) {
        const detail = (Array.isArray(value.content) ? value.content : []).filter(part => part.type === "text").map(part => part.text).join("\n");
        throw new Error(detail || "The chat operation failed.");
      }
      payload ||= value[META];
      for (const key of ["_meta", "meta", "result", "call_tool_result", "callToolResult", "mcp_tool_result", "mcpToolResult", "toolResponseMetadata"]) {
        if (value[key] && typeof value[key] === "object") queue.push(value[key]);
      }
    }
    if (!payload) throw new Error("The connector returned no chat widget data. Refresh the connector tools.");
    return payload;
  }
  function save() {
    clearTimeout(saveTimer);
    const state = { privateContent:{ ...window.openai?.widgetState?.privateContent, draft:input.value, collapsed, pending:[...pendingSends.values()] } };
    try { Promise.resolve(window.openai?.setWidgetState?.(state)).catch(() => {}); } catch {}
  }
  function status(text, error = false, kind = "action") {
    statusKind = kind;
    el("status-text").textContent = text;
    el("status").classList.toggle("error", error);
    el("refresh").hidden = !error;
  }
  function resizeInput() {
    input.style.height = "auto";
    input.style.height = Math.min(150, input.scrollHeight) + "px";
    input.disabled = !available;
    send.disabled = !available || sending || !input.value.trim();
    size();
  }
  function size() {
    if (bridge && !tornDown) { bridge.reportSize(); return; }
    if (initialized && !tornDown) post({ method:"ui/notifications/size-changed", params:{ width:document.documentElement.clientWidth, height:el("chat").offsetHeight } });
  }
  function theme(context) {
    if (context?.theme === "dark" || context?.theme === "light") (scope.host || document.documentElement).dataset.theme = context.theme;
  }
  function presenceDetails(lastCall, now) {
    if (!Number.isFinite(lastCall)) return { state:"offline", label:"offline", delay:null };
    const age = Math.max(0, now - lastCall);
    if (age < 240000) return { state:"online", label:"online", delay:240000 - age };
    if (age < 600000) return { state:"away", label:`last seen ${Math.floor(age / 60000)} mins ago`, delay:60000 - age % 60000 };
    return { state:"offline", label:"offline", delay:null };
  }
  function updatePresence() {
    clearTimeout(presenceTimer);
    const { state, label, delay } = presenceDetails(lastAgentCall, Date.now() + clockOffset);
    const node = el("presence");
    if (node.dataset.state !== state) {
      const svg = icon(state === "online" ? ["m6.5 12 3.5 3.5 7.5-8"] : state === "away" ? ["M12 5.5V12l5.6 3.2"] : ["m8 8 8 8", "m8 16 8-8"], "presence-symbol");
      svg.setAttribute("viewBox", "0 0 24 24");
      svg.setAttribute("style", `stroke:${state === "offline" ? "#85898d" : "#fff"};stroke-width:3`);
      const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      for (const [key, value] of Object.entries({ cx:12, cy:12, r:10.5, fill:state === "online" ? "#159b27" : state === "away" ? "#eba916" : "#fff", stroke:state === "offline" ? "#85898d" : "none" })) circle.setAttribute(key, String(value));
      svg.prepend(circle);
      node.replaceChildren(svg, make("span", "presence-label"));
      node.dataset.state = state;
    }
    node.querySelector(".presence-label").textContent = label;
    node.title = lastAgentCall === null ? "No agent tool call recorded for this conversation." : "Based on this conversation's last agent tool call, not a live connection or proof of ongoing work.";
    if (!tornDown && !document.hidden && delay !== null) presenceTimer = setTimeout(updatePresence, Math.max(1, delay));
  }
  function markdown(container, text) {
    window.renderCodexifyMarkdown(container, text, {
      async open(href, kind) {
        if (kind === "file") {
          const payload = await call("chat_ui_file", { href });
          if (!payload.file || payload.file.type !== "resource_link") throw new Error("The connector returned no downloadable file.");
          if (bridge) await bridge.downloadFile(payload.file);
          else {
            if (!initialized || !hostCapabilities.downloadFile) throw new Error("This host cannot download files from a widget. Open the exported attachment in the ChatGPT conversation.");
            const response = await rpc("ui/download-file", { contents:[payload.file] });
            if (response?.isError) throw new Error("The host declined the file download.");
          }
          status("File download requested.");
        } else if (kind === "anchor") {
          const slug = decodeURIComponent(href.slice(1));
          const heading = [...container.querySelectorAll("h1,h2,h3,h4,h5,h6")].find(node => node.textContent.toLowerCase().replace(/[^\p{L}\p{N} _-]/gu, "").replace(/ /g, "-") === slug);
          if (!heading) throw new Error("This heading is not in the message.");
          heading.scrollIntoView({ block:"nearest" });
        } else if (bridge) await bridge.openLink(href);
        else if (typeof window.openai?.openExternal === "function") await window.openai.openExternal({ href });
        else await rpc("ui/open-link", { url:href });
      },
      error(error) { status(error.message || "The link could not be opened.", true); }
    });
  }
  function messageTime(timestamp, now = Date.now()) {
    if (!Number.isSafeInteger(timestamp) || timestamp < 0) return null;
    const date = new Date(timestamp);
    if (!Number.isFinite(date.getTime())) return null;
    const today = new Date(now);
    today.setHours(0, 0, 0, 0);
    const pad = value => String(value).padStart(2, "0");
    const calendar = `${String(date.getFullYear()).padStart(4, "0")}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    const clock = `${pad(date.getHours())}:${pad(date.getMinutes())}`;
    return { label:(date < today ? calendar + " " : "") + clock, iso:date.toISOString(), title:date.toLocaleString() };
  }
  function scheduleMessageClock() {
    clearTimeout(messageClockTimer);
    if (!available || tornDown || document.hidden) return;
    const now = new Date();
    const midnight = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1);
    messageClockTimer = setTimeout(render, Math.max(1, midnight.getTime() - now.getTime()));
  }
  function receipt(node, message) {
    const state = message.role !== "user" ? "agent" : message.failed ? "failed" : message.pending ? "pending" : message.end <= readThrough ? "read" : message.end <= delivered ? "delivered" : "sent";
    const time = messageTime(message.created_at_ms);
    const signature = JSON.stringify([state, time]);
    if (node._receiptSignature === signature) return;
    node._receiptSignature = signature;
    node.dataset.state = state;
    node.replaceChildren();
    if (time) {
      const stamp = make("time", "message-time", time.label);
      stamp.dateTime = time.iso; stamp.title = time.title;
      node.append(stamp);
    }
    if (message.role !== "user") return;
    if (message.failed) {
      node.append(make("span", "", "Not confirmed"));
      const retry = make("button", "retry", "Retry"); retry.type = "button";
      retry.addEventListener("click", () => { if (!sending) void deliver(message); }); node.append(retry); return;
    }
    if (message.pending) { node.append(make("span", "", "Sending...")); return; }
    const label = state === "read" ? "Read by agent" : state === "delivered" ? "Delivered to agent" : "Saved to CHAT.md";
    const mark = make("span", "ticks " + state);
    mark.setAttribute("role", "img"); mark.setAttribute("aria-label", label);
    mark.title = state === "read" ? "Acknowledged through chat_read, chat_write, or chat_await. This does not prove comprehension." : state === "delivered" ? "Returned in a tool response, but not yet acknowledged by a chat tool." : "Saved. Not yet returned to the agent.";
    mark.append(icon(state !== "sent" ? ["m1 9 4 4L16 2", "m10 12 2 2L23 3"] : ["m5 9 4 4L20 2"])); node.append(mark);
  }
  function render() {
    if (tornDown) return;
    const atBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 50;
    const messages = [...records.values()].sort((a, b) => a.start - b.start).concat([...pendingSends.values()]);
    el("empty").hidden = messages.length > 0;
    if (!messages.length && chatFile) el("empty").textContent = "Messages here stay in this conversation. Send an instruction to the agent below.";
    let previousNode = el("empty");
    for (const message of messages) {
      let node = nodes.get(message.id);
      if (!node) {
        node = make("article", "message " + message.role); node.dataset.messageId = message.id;
        node.append(make("div", "author", message.role === "user" ? "You" : "Agent"), make("div", "markdown"), make("div", "receipt"));
        nodes.set(message.id, node);
      }
      if (node._markdown !== message.markdown) {
        const body = node.querySelector(".markdown"); body.replaceChildren(); markdown(body, message.markdown); node._markdown = message.markdown;
      }
      receipt(node.querySelector(".receipt"), message);
      if (previousNode.nextSibling !== node) list.insertBefore(node, previousNode.nextSibling);
      previousNode = node;
    }
    older.hidden = !hasMore; older.disabled = loadingOlder;
    if (atBottom && !loadingOlder) list.scrollTop = list.scrollHeight;
    scheduleMessageClock();
    size();
  }
  function applyPage(page, history = false) {
    const pendingCount = pendingSends.size;
    if (typeof page.chat_file !== "string" || !Number.isSafeInteger(page.delivered_through)) throw new Error("Invalid chat state from connector.");
    if (chatFile && chatFile !== page.chat_file) throw new Error("This widget's conversation binding changed. Open a new chat widget.");
    chatFile = page.chat_file;
    delivered = Math.max(delivered, page.delivered_through);
    if (Number.isSafeInteger(page.read_through)) readThrough = Math.max(readThrough, page.read_through);
    if (!history) {
      lastAgentCall = Number.isSafeInteger(page.last_agent_call_at_ms) ? page.last_agent_call_at_ms : null;
      if (Number.isSafeInteger(page.server_time_ms)) clockOffset = page.server_time_ms - Date.now();
      updatePresence();
    }
    if (!history) revision = page.revision;
    if (!page.unchanged) {
      const gap = !history && snapshotEnd > 0 && page.has_more && page.messages?.[0]?.start > snapshotEnd;
      for (const message of page.messages || []) {
        if (!Number.isSafeInteger(message.start) || !Number.isSafeInteger(message.end) || typeof message.id !== "string" || typeof message.markdown !== "string" || !["user", "agent"].includes(message.role)) throw new Error("Invalid chat message from connector.");
        const previous = records.get(message.id);
        if (!previous || message.end >= previous.end) records.set(message.id, message);
        pendingSends.delete(message.id);
      }
      if (before === null || history || !records.size || gap) { before = page.before; hasMore = page.has_more; }
      if (!history) snapshotEnd = Math.max(snapshotEnd, ...[...(page.messages || [])].map(message => message.end));
    }
    render();
    if (pendingCount !== pendingSends.size) save();
  }
  function schedule() {
    clearTimeout(pollTimer);
    if (!available || tornDown || collapsed || !visible || document.hidden) return;
    pollTimer = setTimeout(() => { void refresh(); }, failures ? Math.min(30000, 2000 * 2 ** failures) : 2000);
  }
  async function refresh() {
    if (!available || refreshing || tornDown || collapsed || !visible || document.hidden) return;
    refreshing = true;
    try {
      applyPage(await call("chat_ui_state", revision ? { revision } : {})); failures = 0;
      if (statusKind !== "action") status("Enter to send. Shift + Enter for a new line.", false, "normal");
    } catch (error) { failures++; status(error.message || "Connection unavailable. Messages are retained.", true, "connection"); }
    finally { refreshing = false; schedule(); }
  }
  async function deliver(message) {
    if (!available || sending || tornDown) return;
    sending = true; message.failed = false; message.pending = true;
    pendingSends.set(message.id, message); render(); resizeInput(); save();
    try {
      const payload = await call("chat_ui_send", { request_id:message.id, message:message.markdown });
      if (payload.sent?.id !== message.id || !Number.isSafeInteger(payload.sent.end)) throw new Error("The send receipt was incomplete. Retry uses the same message ID.");
      pendingSends.delete(message.id);
      if (!records.has(message.id)) records.set(message.id, { ...message, pending:false, failed:false, start:payload.sent.end - 1, end:payload.sent.end, created_at_ms:payload.sent.created_at_ms });
      status("Saved to CHAT.md. The agent receives it on a tool response."); revision = null;
      void refresh();
    } catch (error) {
      if (!records.has(message.id)) { message.failed = true; message.pending = false; pendingSends.set(message.id, message); }
      status(error.message || "Message delivery is unconfirmed. Retry without duplicating it.", true);
    } finally { sending = false; render(); resizeInput(); save(); }
  }
  el("composer").addEventListener("submit", event => {
    event.preventDefault();
    if (!available || sending || !input.value.trim()) return;
    const message = { id:crypto.randomUUID(), role:"user", markdown:input.value, pending:true, failed:false, created_at_ms:Date.now() };
    input.value = ""; resizeInput(); void deliver(message); input.focus(); list.scrollTop = list.scrollHeight;
  });
  input.addEventListener("keydown", event => {
    if (event.key === "Enter" && !event.shiftKey && !event.isComposing && event.keyCode !== 229) { event.preventDefault(); el("composer").requestSubmit(); }
  });
  input.addEventListener("input", () => { resizeInput(); clearTimeout(saveTimer); saveTimer = setTimeout(save, 150); });
  older.addEventListener("click", async () => {
    if (loadingOlder || before === null) return;
    loadingOlder = true; older.disabled = true;
    const height = list.scrollHeight, top = list.scrollTop;
