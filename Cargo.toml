[package]
name = "codexify"
version = "1.0.1"
edition = "2024"
description = "Codexify MCP bridge, ported to Rust: a local Streamable-HTTP MCP server exposing Codex-style agent tools over a chosen work directory."
license = "MIT"

[[bin]]
name = "codexify"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.1.3", features = ["client", "server", "transport-child-process", "transport-streamable-http-server"] }
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
regex = "1"
ignore = "0.4"
globset = "0.4"
walkdir = "2"
sha2 = "0.10"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1.92"
toml = "1.1.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tempfile = "3"
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `thin` LTO keeps nearly all of full-LTO's runtime benefit for an I/O-bound
# MCP server while cutting release build time roughly in half; the default
# codegen-units (16) restores parallel codegen instead of serialising on one.
[profile.release]
lto = "thin"
strip = true
