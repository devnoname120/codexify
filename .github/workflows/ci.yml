name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - uses: oven-sh/setup-bun@v2.2.0
        id: browser-bun
        with:
          bun-version: 1.4.0

      - name: Install browser companion dependencies
        working-directory: browser-companion
        run: bun install --frozen-lockfile

      - name: Test and build browser companion
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/generate-browser-companion-protocol-fixtures.mjs
          git diff --exit-code -- browser-companion/protocol-fixtures/v1.json
          node scripts/update-browser-companion-upstream.mjs --check
          cd browser-companion
          bun test
          bun run typecheck
          bun run build
          cd ..
          node --test scripts/test-browser-companion-boundary.mjs

      - name: Package and smoke browser companion
        run: |
          sudo rm -f \
            /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources
          cd browser-companion
          bun x --no-install patchright install-deps chromium
          bun run install:chrome
          CODEXIFY_TEST_BROWSER_COMPANION_CHROME=1 xvfb-run -a bun test ./tests/chrome-surface.test.ts ./tests/capability-discovery.test.ts ./tests/picker-layouts.test.ts ./tests/account-settings.test.ts
          CODEXIFY_TEST_BROWSER_COMPANION_CHROME=1 xvfb-run -a bun test ./tests/conversation-approval.test.ts
          CODEXIFY_TEST_BROWSER_COMPANION_CHROME=1 xvfb-run -a bun test ./tests/pairing-submit.test.ts -t 'offline Stop resumes the captured|late Stop dialog during message preparation|Japanese lazy picker|conversation length|conversation-length|task continuation|re-pairing sends'
          bun run package
          bun run smoke:package

      - name: Validate POSIX installer
        run: |
          sh -n install.sh
          sh -n scripts/test-posix-installer.sh
          ./scripts/test-posix-installer.sh

      - name: Validate PowerShell installer
        shell: pwsh
        run: |
          foreach ($path in @('install.ps1', 'scripts/test-windows-installer.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path),
              [ref]$tokens,
              [ref]$errors
            ) > $null
            if ($errors.Count) {
              $errors | ForEach-Object { Write-Error "${path}: $_" }
              exit 1
            }
          }

      - name: Test release notarization orchestration
        run: python3 -m unittest scripts.test_release_notarization -v

      - name: Test notarization webhook relay
        run: node --test scripts/test-cloudflare-notary-webhook.mjs

      - name: Format
        run: |
          cargo fmt --all --check
          rustfmt --edition 2024 --check src/server_markdown_chat_tests.rs src/server_markdown_chat_widget_tests.rs src/server_workspace_tests.rs src/server_agent_ticket_tests.rs

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

      - name: Test Rust and TypeScript browser companion contract
        env:
          CODEXIFY_TEST_BROWSER_COMPANION_BUN: ${{ steps.browser-bun.outputs.bun-path }}
        run: cargo test --test browser_companion_contract -- --ignored --nocapture

      - uses: actions/setup-python@v7
        id: notification-python
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-notifications.txt

      - name: Install notification test dependencies
        run: python -m pip install -r scripts/requirements-notifications.txt

      - name: Test real notification adapters without external delivery
        run: python -m unittest scripts.test_apprise_notifications -v

      - name: Test notification subprocesses with a local HTTP receiver
        env:
          CODEXIFY_TEST_APPRISE_PYTHON: ${{ steps.notification-python.outputs.python-path }}
        run: cargo test --test markdown_chat_notifications --test markdown_chat_tools -- --include-ignored

      - name: Test setup widget transitions
        run: node --test scripts/test-setup-widget.mjs

  diff-widget:
    name: Diff widget layout (Chromium and WebKit)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install browser test dependencies
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          # Playwright only needs Ubuntu packages here. The runner's optional
          # Chrome repository can be mid-publish and make apt reject unrelated
          # dependency installs with a transient hash mismatch.
          sudo rm -f \
            /etc/apt/sources.list.d/google-chrome.list \
            /etc/apt/sources.list.d/google-chrome.sources
          npx --no-install playwright install --with-deps chromium webkit

      - name: Test diff layout on mobile and desktop
        run: node --test scripts/test-diff-widget.mjs

      - name: Test Markdown chat composer, attachments, synchronization, and receipts
        run: node --test --test-concurrency=1 scripts/test-markdown-chat-widget.mjs scripts/test-owner-chat-attachments.mjs

      - name: Test Home Screen app metadata and private launch
        run: node --test scripts/test-owner-chat-pwa.mjs scripts/test-mobile-install.mjs

      - name: Test private message queue and composer modes
        run: node --test scripts/test-message-queue.mjs scripts/test-connector-name.mjs

      - name: Test settings, update progress, and startup readiness
        run: node --test --test-concurrency=1 scripts/test-global-settings.mjs scripts/test-update-progress.mjs scripts/test-new-chat-progress.mjs scripts/test-chat-wakeup.mjs

      - name: Test usage analytics dashboard
        run: node --test --test-concurrency=1 scripts/test-usage-analytics.mjs scripts/test-analytics-share.mjs scripts/test-statistics-extras.mjs

      - name: Test workspace picker, reuse, switching, refresh dialog, and owner sidebar
        run: node --test --test-concurrency=1 scripts/test-workspace-widget.mjs scripts/test-workspace-picker.mjs scripts/test-owner-chat.mjs scripts/test-owner-chat-unread.mjs scripts/test-owner-chat-retries.mjs scripts/test-owner-chat-goal-preview.mjs scripts/test-owner-chat-organization.mjs scripts/test-owner-chat-polish.mjs scripts/test-chat-workspace-switch.mjs

  service-platforms:
    name: Service integration (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test POSIX installer on macOS
        if: runner.os == 'macOS'
        run: ./scripts/test-posix-installer.sh

      - name: Test Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1

      - name: Test service contracts
        run: cargo test --all-targets service

      - name: Test self-update contracts
        run: cargo test self_update

      - name: Test Markdown chat storage and tools
        run: cargo test --test markdown_chat --test markdown_chat_tools --test markdown_chat_timestamps

      - name: Test standalone owner chat persistence
        run: |
          cargo test --lib owner_chat
          cargo test --test owner_chat_restart

      - name: Test legacy configuration migration against startup validation
        run: cargo test --test legacy_migration

      - name: Test Markdown chat dispatch, watching, and schemas
        run: cargo test --lib markdown_chat

      - name: Test agent ticket coordination and persistence
        run: cargo test --lib agent_ticket

      - uses: actions/setup-python@v7
        id: notification-python
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements-notifications.txt

      - name: Install notification test dependencies
        run: python -m pip install -r scripts/requirements-notifications.txt

      - name: Test real notification adapters without external delivery
        run: python -m unittest scripts.test_apprise_notifications -v

      - name: Test notification subprocesses with a local HTTP receiver
        env:
          CODEXIFY_TEST_APPRISE_PYTHON: ${{ steps.notification-python.outputs.python-path }}
        run: cargo test --test markdown_chat_notifications --test markdown_chat_tools -- --include-ignored
