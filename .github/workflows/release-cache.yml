name: Warm release dependency caches

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - browser-companion/package.json
      - browser-companion/bun.lock
      - browser-companion/scripts/**
      - rust-toolchain
      - rust-toolchain.toml
      - .cargo/**
      - .github/workflows/release.yml
      - .github/workflows/release-cache.yml
  schedule:
    - cron: "17 4 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-cache-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  warm:
    name: Warm release dependencies (${{ matrix.name }})
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            cross_linker: aarch64-linux-gnu-gcc
            apt_packages: gcc-aarch64-linux-gnu
          - name: darwin-x64
            os: macos-15
            target: x86_64-apple-darwin
          - name: darwin-arm64
            os: macos-15
            target: aarch64-apple-darwin
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        id: cache
        with:
          shared-key: release-${{ matrix.target }}
          cache-bin: false
          lookup-only: true
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install cross linker (linux-arm64)
        if: matrix.apt_packages != '' && steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_packages }}

      - name: Build release dependencies on cache miss
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.cross_linker }}
        run: cargo build --release --locked --target ${{ matrix.target }}

  browser:
    name: Warm browser companion dependencies (${{ matrix.name }})
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            platform: linux
            arch: x64
          - name: linux-arm64
            os: ubuntu-latest
            platform: linux
            arch: arm64
          - name: darwin-x64
            os: macos-15
            platform: darwin
            arch: x64
          - name: darwin-arm64
            os: macos-15
            platform: darwin
            arch: arm64
          - name: windows-x64
            os: windows-latest
            platform: win32
            arch: x64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.0

      - uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: browser-release-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('browser-companion/bun.lock') }}

      - name: Install browser companion dependencies
        working-directory: browser-companion
        run: bun install --frozen-lockfile

      - name: Warm Electron package cache
        working-directory: browser-companion
        run: bun run package -- --platform=${{ matrix.platform }} --arch=${{ matrix.arch }}
