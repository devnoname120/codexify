name: Handle Apple notarization event

on:
  repository_dispatch:
    types: [apple-notarization-complete]
  workflow_dispatch:
    inputs:
      tag:
        description: Optional draft release tag; blank processes every pending Codexify draft
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: finalize-notarized-releases
  cancel-in-progress: false

jobs:
  finalize:
    name: Evaluate pending Codexify notarizations
    runs-on: macos-14
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REQUESTED_TAG: ${{ github.event.client_payload.tag || inputs.tag || '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Materialize App Store Connect API key
        env:
          P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$P8_BASE64"
          python3 - "$RUNNER_TEMP/AuthKey.p8" <<'PY'
          import base64
          import os
          import pathlib
          import sys

          pathlib.Path(sys.argv[1]).write_bytes(
              base64.b64decode(os.environ["P8_BASE64"], validate=True)
          )
          PY
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Verify notarizations and publish accepted drafts
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          ARGS=(
            finalize
            --repo "$GITHUB_REPOSITORY"
            --notary-key "$RUNNER_TEMP/AuthKey.p8"
            --notary-key-id "$APPLE_NOTARY_KEY_ID"
            --notary-issuer "$APPLE_NOTARY_ISSUER_ID"
            --team-id "$APPLE_TEAM_ID"
            --identifier dev.codexify
          )
          if [ -n "$REQUESTED_TAG" ]; then
            ARGS+=(--tag "$REQUESTED_TAG")
          fi
          python3 scripts/release_notarization.py "${ARGS[@]}"

      - name: Remove temporary notary key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
