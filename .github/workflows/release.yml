name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false

      - name: Verify tag matches Cargo.toml version
        run: |
          MANIFEST="$(cargo metadata --format-version=1 --no-deps \
            | jq -r '.packages[] | select(.name == "codexify") | .version')"
          EXPECTED="v${MANIFEST}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version (${EXPECTED}). Bump Cargo.toml or retag."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches Cargo.toml version ${EXPECTED}."

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

  build:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
            archive: tar.gz
          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            ext: ""
            archive: tar.gz
            cross_linker: aarch64-linux-gnu-gcc
            apt_packages: gcc-aarch64-linux-gnu
          - name: darwin-x64
            # Cross-compile the Intel binary on Apple-Silicon runners: the
            # macos-13 (Intel) pool has a long queue and was stalling releases.
            # macos-14's toolchain targets x86_64 fine and starts quickly.
            os: macos-14
            target: x86_64-apple-darwin
            ext: ""
            archive: tar.gz
            macos_sign: true
          - name: darwin-arm64
            os: macos-14
            target: aarch64-apple-darwin
            ext: ""
            archive: tar.gz
            macos_sign: true
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            archive: zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-${{ matrix.target }}
          cache-bin: false
          save-if: false

      - name: Install cross linker (linux-arm64)
        if: matrix.apt_packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_packages }}

      - name: Import Developer ID certificate
        id: signing
        if: matrix.macos_sign
        shell: bash
        env:
          P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$P12_BASE64"
          test -n "$P12_PASSWORD"
          CERTIFICATE="$RUNNER_TEMP/codexify-developer-id.p12"
          KEYCHAIN="$RUNNER_TEMP/codexify-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          python3 - "$CERTIFICATE" <<'PY'
          import base64
          import os
          import pathlib
          import sys

          pathlib.Path(sys.argv[1]).write_bytes(
              base64.b64decode(os.environ["P12_BASE64"], validate=True)
          )
          PY
          chmod 600 "$CERTIFICATE"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          security import "$CERTIFICATE" \
            -k "$KEYCHAIN" \
            -P "$P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN" >/dev/null
          IDENTITIES="$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | awk '/"Developer ID Application:/{print $2}')"
          test "$(printf '%s\n' "$IDENTITIES" | sed '/^$/d' | wc -l | tr -d ' ')" = 1
          printf 'identity=%s\n' "$IDENTITIES" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.cross_linker }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Sign macOS executable
        if: matrix.macos_sign
        shell: bash
        env:
          SIGNING_IDENTITY: ${{ steps.signing.outputs.identity }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          CODE_SIGN_KEYCHAIN: ${{ runner.temp }}/codexify-signing.keychain-db
        run: |
          set -euo pipefail
          scripts/sign-macos-release.sh \
            "target/${{ matrix.target }}/release/codexify" \
            "$SIGNING_IDENTITY" \
            "$APPLE_TEAM_ID" \
            dev.codexify

      - name: Stage artifacts
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          STAGE="codexify-${VERSION}-${{ matrix.name }}"
          mkdir "${STAGE}"
          cp "target/${{ matrix.target }}/release/codexify${{ matrix.ext }}" "${STAGE}/"
          cp codexify.config.json CHANGELOG.md LICENSE README.md "${STAGE}/"
          mkdir "${STAGE}/docs"
          cp docs/REFERENCE.md docs/ARCHITECTURE.md "${STAGE}/docs/"
          test -s "${STAGE}/CHANGELOG.md"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "STAGE=${STAGE}" >> "$GITHUB_ENV"

      - name: Package tar.gz
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          tar czf "${STAGE}.tar.gz" "${STAGE}"
          echo "ARCHIVE=${STAGE}.tar.gz" >> "$GITHUB_ENV"

      - name: Package zip
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          7z a "${STAGE}.zip" "${STAGE}" >/dev/null
          echo "ARCHIVE=${STAGE}.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v5
        with:
          name: codexify-${{ matrix.name }}
          path: ${{ env.ARCHIVE }}

      - name: Remove temporary signing material
        if: always() && matrix.macos_sign
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/codexify-signing.keychain-db" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/codexify-developer-id.p12"

  deploy-installers:
    needs: [check, build]
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  stage-release:
    needs: [check, build, deploy-installers]
    runs-on: macos-14
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          pattern: codexify-*
          path: artifacts
          merge-multiple: true

      - name: Materialize App Store Connect API key
        env:
          P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$P8_BASE64"
          python3 - "$RUNNER_TEMP/AuthKey.p8" <<'PY'
          import base64
          import os
          import pathlib
          import sys

          pathlib.Path(sys.argv[1]).write_bytes(
              base64.b64decode(os.environ["P8_BASE64"], validate=True)
          )
          PY
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Stage draft release and submit notarizations
        env:
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_WEBHOOK_URL: ${{ secrets.APPLE_NOTARY_WEBHOOK_URL }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          python3 scripts/release_notarization.py stage \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --artifacts-dir artifacts \
            --notary-key "$RUNNER_TEMP/AuthKey.p8" \
            --notary-key-id "$APPLE_NOTARY_KEY_ID" \
            --notary-issuer "$APPLE_NOTARY_ISSUER_ID" \
            --webhook-url "$APPLE_NOTARY_WEBHOOK_URL" \
            --team-id "$APPLE_TEAM_ID" \
            --identifier dev.codexify

      - name: Remove temporary notary key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
