name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo.toml version
        run: |
          MANIFEST="$(cargo metadata --format-version=1 --no-deps \
            | jq -r '.packages[] | select(.name == "codexify") | .version')"
          EXPECTED="v${MANIFEST}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Cargo.toml version (${EXPECTED}). Bump Cargo.toml or retag."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches Cargo.toml version ${EXPECTED}."

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all

  build:
    needs: check
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
            archive: tar.gz
          - name: linux-arm64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            ext: ""
            archive: tar.gz
            cross_linker: aarch64-linux-gnu-gcc
            apt_packages: gcc-aarch64-linux-gnu
          - name: darwin-x64
            # Cross-compile the Intel binary on Apple-Silicon runners: the
            # macos-13 (Intel) pool has a long queue and was stalling releases.
            # macos-14's toolchain targets x86_64 fine and starts quickly.
            os: macos-14
            target: x86_64-apple-darwin
            ext: ""
            archive: tar.gz
          - name: darwin-arm64
            os: macos-14
            target: aarch64-apple-darwin
            ext: ""
            archive: tar.gz
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
            archive: zip

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross linker (linux-arm64)
        if: matrix.apt_packages != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt_packages }}

      - name: Build
        shell: bash
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.cross_linker }}
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Stage artifacts
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          STAGE="codexify-${VERSION}-${{ matrix.name }}"
          mkdir "${STAGE}"
          cp "target/${{ matrix.target }}/release/codexify${{ matrix.ext }}" "${STAGE}/"
          cp codexify.config.json LICENSE README.md "${STAGE}/"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "STAGE=${STAGE}" >> "$GITHUB_ENV"

      - name: Package tar.gz
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          tar czf "${STAGE}.tar.gz" "${STAGE}"
          echo "ARCHIVE=${STAGE}.tar.gz" >> "$GITHUB_ENV"

      - name: Package zip
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          7z a "${STAGE}.zip" "${STAGE}" >/dev/null
          echo "ARCHIVE=${STAGE}.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v5
        with:
          name: codexify-${{ matrix.name }}
          path: ${{ env.ARCHIVE }}

  deploy-installers:
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml

  release:
    needs: [build, deploy-installers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: codexify-*
          path: artifacts
          merge-multiple: true

      - name: Create checksums
        working-directory: artifacts
        run: |
          # Name the archives explicitly so checksums.txt cannot hash itself.
          sha256sum codexify-* > checksums.txt
          cat checksums.txt

      - name: Verify every published asset is checksummed
        working-directory: artifacts
        run: |
          status=0
          for f in codexify-*; do
            if ! grep -q "  ${f}\$" checksums.txt; then
              echo "::error::Asset ${f} is missing from checksums.txt"
              status=1
            fi
          done
          exit "${status}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
